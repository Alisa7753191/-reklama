<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ПравоРеклама — проверка рекламы на правовые риски РФ</title>
<style>
  :root{
    --bg:#eef1f7;--surface:#fff;--surface-2:#f7f9fd;--border:#e2e6f0;--text:#172033;
    --muted:#5c6678;--primary:#2c4bd8;--primary-ink:#1f37a8;--primary-weak:#eaeefb;
    --low:#278a4f;--medium:#b5870a;--high:#d95f0b;--critical:#d0302c;
    --low-bg:#e7f4ec;--medium-bg:#fbf1dc;--high-bg:#fdeadd;--critical-bg:#fbe6e5;
    --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(20,30,60,.06),0 10px 30px rgba(20,30,60,.07);--radius:14px;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0d1320;--surface:#151d2c;--surface-2:#1b2434;--border:#29344a;--text:#e7ecf6;
    --muted:#94a1b8;--primary:#6d8bff;--primary-ink:#9db3ff;--primary-weak:#1d2947;
    --low:#4bbd76;--medium:#e0af23;--high:#f5842c;--critical:#f0524d;
    --low-bg:#16281e;--medium-bg:#2a2312;--high-bg:#2c1d11;--critical-bg:#2c1614;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.4);
  }}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--font-sans);color:var(--text);line-height:1.55;
    background:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--primary) 8%,transparent),transparent 60%),var(--bg);
    min-height:100vh;padding:0 16px 72px;-webkit-font-smoothing:antialiased;
  }
  .container{max-width:860px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 4px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:13px}
  .brand__mark{width:46px;height:46px;flex:none;display:grid;place-items:center;font-size:24px;border-radius:12px;
    background:linear-gradient(150deg,var(--primary),var(--primary-ink));box-shadow:var(--shadow);color:#fff}
  .brand__name{font-size:20px;font-weight:750;letter-spacing:-.02em}
  .brand__tag{font-size:12.5px;color:var(--muted);margin-top:1px}
  .mode{font-size:12px;font-weight:650;padding:6px 13px;border-radius:999px;background:var(--primary-weak);
    color:var(--primary-ink);border:1px solid color-mix(in srgb,var(--primary) 22%,transparent)}
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .panel{padding:18px 20px;margin-bottom:18px}
  .panel .eyebrow{display:block;margin-bottom:8px}
  textarea{width:100%;border:1px solid var(--border);border-radius:11px;padding:13px 15px;font-size:15px;
    font-family:inherit;color:var(--text);background:var(--surface-2);resize:vertical;outline:none;min-height:130px}
  textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
  .actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px;flex-wrap:wrap}
  .channel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .channel select{font-family:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
  .chan-note{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
  .btn{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:11px 26px;font-size:15px;
    font-weight:650;cursor:pointer}
  .btn:hover{background:var(--primary-ink)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .linkbtn{background:none;border:none;color:var(--primary);cursor:pointer;font-size:13px;padding:0}
  .ghost{background:transparent;color:var(--primary);border:1px solid var(--primary);padding:9px 18px;font-size:14px;border-radius:10px;cursor:pointer;font-weight:650}
  .ghost:hover{background:var(--primary-weak)}

  .hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;padding:22px 24px;border-radius:var(--radius);margin-bottom:14px;border:1px solid var(--border)}
  .hero--low{background:var(--low-bg);border-color:color-mix(in srgb,var(--low) 30%,transparent)}
  .hero--medium{background:var(--medium-bg);border-color:color-mix(in srgb,var(--medium) 30%,transparent)}
  .hero--high{background:var(--high-bg);border-color:color-mix(in srgb,var(--high) 30%,transparent)}
  .hero--critical{background:var(--critical-bg);border-color:color-mix(in srgb,var(--critical) 30%,transparent)}
  .light{display:flex;flex-direction:column;gap:6px;align-items:center}
  .light__dot{width:15px;height:15px;border-radius:50%;background:currentColor;opacity:.22}
  .light__dot--on{opacity:1;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 22%,transparent)}
  .light--low{color:var(--low)}.light--medium{color:var(--medium)}.light--high{color:var(--high)}.light--critical{color:var(--critical)}
  .hero__label{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .hero__level{font-size:25px;font-weight:780;letter-spacing:-.01em}
  .hero__level--low{color:var(--low)}.hero__level--medium{color:var(--medium)}.hero__level--high{color:var(--high)}.hero__level--critical{color:var(--critical)}
  .hero__sub{font-size:14px;margin-top:3px}

  .counts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .count{font-size:12.5px;font-weight:650;padding:5px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--border);background:var(--surface);font-variant-numeric:tabular-nums}
  .count .swatch{width:9px;height:9px;border-radius:50%}
  .chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .chip{font-size:12.5px;font-weight:650;padding:5px 12px;border-radius:8px;background:var(--primary-weak);color:var(--primary-ink)}
  .section-label{font-size:13px;font-weight:700;color:var(--muted);margin:0 4px 12px}

  .findings{display:flex;flex-direction:column;gap:15px}
  .finding{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px 20px 20px;overflow:hidden}
  .finding::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
  .finding--high::before{background:var(--high)}.finding--medium::before{background:var(--medium)}
  .finding--low::before{background:var(--low)}.finding--critical::before{background:var(--critical)}
  .f-head{display:flex;align-items:flex-start;gap:11px;flex-wrap:wrap}
  .f-num{width:25px;height:25px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:750;border-radius:50%;
    background:var(--primary-weak);color:var(--primary-ink);font-variant-numeric:tabular-nums}
  .f-title{font-size:16.5px;font-weight:700;margin:0;flex:1;min-width:190px;letter-spacing:-.01em;text-wrap:balance}
  .f-tags{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:750;padding:4px 11px;border-radius:999px;color:#fff}
  .badge--high{background:var(--high)}.badge--medium{background:var(--medium)}.badge--low{background:var(--low)}.badge--critical{background:var(--critical)}
  .src{font-size:11px;font-weight:650;padding:4px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
  .f-desc{font-size:14.5px;margin:12px 0 0}
  .evidence{margin:13px 0 0;padding:11px 14px;border-radius:0 9px 9px 0;background:var(--surface-2);
    border-left:3px solid var(--muted);font-family:var(--font-mono);font-size:13px}
  .evidence .eyebrow{display:block;margin-bottom:5px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:15px}
  .block{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:13px 15px}
  .block h4{margin:0 0 9px;font-size:12.5px;font-weight:750}
  .block p,.block li{font-size:13px;margin:0}
  .block ul{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:6px}
  .law-ref{font-weight:700}.law-sum{color:var(--muted);font-size:12px;margin-top:4px}
  .fines{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:4px}
  .fines li{display:flex;justify-content:space-between;gap:12px;font-size:12.5px}
  .fines .amt{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
  .link{color:var(--primary);text-decoration:none;font-size:12px;font-weight:600}
  .link:hover{text-decoration:underline}
  .empty{margin-top:16px;background:var(--low-bg);color:var(--low);padding:20px;border-radius:var(--radius);text-align:center;font-weight:650}
  .disclaimer{margin-top:26px;padding:15px 18px;border-radius:12px;font-size:12.5px;color:var(--muted);
    background:var(--surface);border:1px dashed var(--border)}
  .footer{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
  .hidden{display:none}
  @media (max-width:620px){.grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}}
  @media print{.top .mode,.panel,.footer,#exportBtn{display:none!important}.finding,.hero,.badge,.chip{-webkit-print-color-adjust:exact;print-color-adjust:exact}.finding{break-inside:avoid}}
</style>
</head>
<body>
<div class="container">
  <header class="top">
    <div class="brand">
      <div class="brand__mark">⚖️</div>
      <div>
        <div class="brand__name">ПравоРеклама</div>
        <div class="brand__tag">Проверка рекламы на правовые риски · законодательство РФ</div>
      </div>
    </div>
    <div class="mode">Локальная версия · движок правил</div>
  </header>

  <section class="card panel">
    <span class="eyebrow">Рекламный текст для проверки</span>
    <textarea id="input" placeholder="Вставьте рекламный текст, объявление, пост или слоган…"></textarea>
    <div class="actions">
      <div class="channel">
        <label for="channel">Канал:</label>
        <select id="channel">
          <option value="internet">Интернет</option>
          <option value="sms">СМС / рассылка</option>
          <option value="tv">ТВ</option>
          <option value="radio">Радио</option>
          <option value="print">Печать</option>
          <option value="outdoor">Наружная</option>
        </select>
        <button class="linkbtn" id="exampleBtn">Пример</button>
      </div>
      <button class="btn" id="checkBtn">Проверить</button>
    </div>
  </section>

  <div id="report"></div>

  <div class="footer">
    ПравоРеклама · автономная версия (проверка правилами, работает офлайн). Полная версия добавляет ИИ-анализ смысла.
  </div>
</div>

<script>
"use strict";
/* Автономный движок правил. Данные (KB) генерируются из backend/app/knowledge/*.yaml
   сборщиком backend/tools/build_standalone.py — правьте YAML, не этот файл. */
const KB = {"laws":{"fz38_st5_p2":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 5, ч. 2","title":"Недобросовестная реклама","summary":"Недобросовестной признаётся реклама, которая содержит некорректные сравнения с товарами конкурентов, порочит честь и достоинство, представляет собой акт недобросовестной конкуренции либо рекламирует товар под видом другого.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz38_st5_p3":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 5, ч. 3","title":"Недостоверная реклама","summary":"Недостоверной признаётся реклама, содержащая не соответствующие действительности сведения — в т.ч. о преимуществах перед конкурентами, о характеристиках, стоимости, гарантиях, результатах исследований.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz38_st5_p3_1":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 5, ч. 3, п. 1","title":"Недостоверные сведения о преимуществах (превосходная степень)","summary":"Не соответствующие действительности сведения о преимуществах товара перед находящимися в обороте товарами других изготовителей. Использование слов «лучший», «первый», «номер один», «самый», «единственный» и т.п. без документального подтверждения объективными критериями трактуется ФАС как недостоверная реклама.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz38_st5_p7":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 5, ч. 7","title":"Отсутствие существенной информации","summary":"Не допускается реклама, в которой отсутствует часть существенной информации о рекламируемом товаре, об условиях его приобретения или использования, если при этом искажается смысл информации и вводятся в заблуждение потребители.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz38_st5_p11":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 5, ч. 11","title":"Использование иностранных слов без перевода","summary":"В рекламе не допускается использование иностранных слов и выражений, которые могут привести к искажению смысла информации.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz38_st6":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 6","title":"Защита несовершеннолетних в рекламе","summary":"В рекламе не допускается дискредитация родителей и воспитателей, побуждение несовершеннолетних убедить родителей приобрести товар, создание искажённого представления о доступности товара для семьи с любым уровнем достатка, формирование комплекса неполноценности у детей и т.п.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz38_st7":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 7","title":"Объекты рекламирования, реклама которых не допускается","summary":"Запрещена реклама товаров, производство/оборот которых запрещены; наркотических средств; взрывчатых веществ; органов и тканей человека; товаров без обязательной сертификации/лицензии; никотинсодержащей продукции, кальянов, устройств для потребления никотина и др.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz38_st21":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 21","title":"Реклама алкогольной продукции","summary":"Реклама алкоголя не должна обращаться к несовершеннолетним, использовать их образы, образы людей и животных; утверждать о пользе алкоголя; размещаться в детских, образовательных, медицинских, спортивных учреждениях и ближе 100 м от них, на транспорте, наружной рекламе. Должна сопровождаться предупреждением о вреде (не менее 10% площади). Реклама алкоголя в сети «Интернет» запрещена.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz38_tobacco":{"law":"ФЗ «О рекламе» № 38-ФЗ; ФЗ № 15-ФЗ","article":"ст. 7 ФЗ-38; ст. 16 ФЗ-15 (ст. 23 ФЗ-38 утратила силу)","title":"Запрет рекламы табачной и никотинсодержащей продукции","summary":"Статья 23 ФЗ-38 утратила силу (274-ФЗ от 21.10.2013). Реклама табака, табачной, никотинсодержащей продукции, устройств для их потребления, кальянов, вейпов и процесса потребления запрещена: ст. 7 ФЗ-38 и ст. 16 ФЗ-15 «Об охране здоровья граждан от воздействия окружающего табачного дыма…».","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz38_st24":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 24","title":"Реклама лекарств, медицинских изделий и услуг","summary":"Реклама лекарственных препаратов, медицинских изделий и услуг, методов лечения должна сопровождаться предупреждением о наличии противопоказаний, необходимости ознакомиться с инструкцией или получить консультацию специалиста (в радио- и видеорекламе — не менее 3 секунд, в иной — не менее 5% рекламной площади). Не допускается реклама рецептурных препаратов вне специализированных изданий, гарантии эффективности, ссылки на конкретные случаи излечения.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz38_st25":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 25","title":"Реклама биологически активных добавок (БАД)","summary":"Реклама БАД не должна создавать впечатление, что они являются лекарственными средствами, обладают лечебными свойствами, содержать ссылки на конкретные случаи излечения. Должна сопровождаться предупреждением о том, что объект рекламирования не является лекарственным средством (не менее 10% площади/времени).","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz38_st27":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 27","title":"Реклама основанных на риске игр и пари","summary":"Реклама азартных игр и пари (казино, букмекерских контор) допускается с ограничениями: не обращаться к несовершеннолетним, не создавать впечатление гарантированного выигрыша/источника дохода, сопровождаться предупреждением о рисках, размещаться в строго ограниченных местах и время.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz38_st28_1":{"law":"ФЗ «О рекламе» № 38-ФЗ (наименование — ГК РФ ст. 54, 1473)","article":"ст. 28, ч. 1","title":"Реклама финансовых услуг — фирменное наименование лица","summary":"Реклама банковских, страховых и иных финансовых услуг должна содержать наименование или имя лица, оказывающего услуги. Для юридического лица «наименование» — это его ФИРМЕННОЕ наименование (организационно-правовая форма + название), а не бренд, логотип, товарный знак или коммерческое обозначение. Для ИП — фамилия, имя, отчество. Реклама только под брендом без фирменного наименования нарушает ст. 28 ч. 1 (практика ФАС).","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/0021818db8b93ae5fbd38076074a7182e157186c/"},"fz38_st28_2_1":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 28, ч. 2, п. 1","title":"Запрет гарантий доходности вложений","summary":"Реклама финансовых услуг не должна содержать гарантии или обещания в будущем эффективности деятельности (доходности вложений), в т.ч. основанные на реальных показателях в прошлом, если такая доходность не может быть определена на момент заключения договора. Актуально для инвестиций, ценных бумаг, форекс, ДУ.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/0021818db8b93ae5fbd38076074a7182e157186c/"},"fz38_st28_2_2":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 28, ч. 2, п. 2","title":"Запрет умолчания об условиях (триггерное правило)","summary":"Реклама финансовых услуг не должна умалчивать об иных условиях оказания услуг, влияющих на сумму доходов или расходов потребителя, если в рекламе сообщается хотя бы одно из таких условий. Для вкладов: указал ставку — раскрой срок, сумму, капитализацию, условия пополнения/снятия.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/0021818db8b93ae5fbd38076074a7182e157186c/"},"fz38_st28_credit":{"law":"ФЗ «О рекламе» № 38-ФЗ (ред. 479-ФЗ от 26.12.2024)","article":"ст. 28, ч. 2.1–3.2 (реклама потребительского кредита/займа)","title":"Реклама кредитов и займов — специальные требования","summary":"С 01.03.2025 к рекламе потребительского кредита (займа) применяется комплекс требований ч. 2.1, 3, 3.1 ст. 28; в силу ч. 3.2 те же правила действуют для кредитов физлицам, обеспеченных ипотекой.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/0021818db8b93ae5fbd38076074a7182e157186c/"},"fz38_st28_2_1_terms":{"law":"ФЗ «О рекламе» № 38-ФЗ (введена 479-ФЗ от 26.12.2024)","article":"ст. 28, ч. 2.1","title":"«Изучите все условия кредита (займа)» либо все условия в рекламе","summary":"Если реклама кредита (займа) содержит хотя бы одно условие, влияющее на полную стоимость кредита (по 353-ФЗ), она должна либо содержать предупреждение «Изучите все условия кредита (займа)» с указанием на раздел официального сайта кредитора с подробными условиями, либо содержать все такие условия непосредственно в рекламе (радио ≥3 сек; ТВ/видео ≥3 сек и ≥5% кадра; иное ≥5% площади).","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/0021818db8b93ae5fbd38076074a7182e157186c/"},"fz38_st28_3_psk":{"law":"ФЗ «О рекламе» № 38-ФЗ (ред. 479-ФЗ от 26.12.2024)","article":"ст. 28, ч. 3","title":"Диапазоны ПСК при указании процентных ставок","summary":"Если реклама кредита (займа) содержит информацию о процентных ставках, она должна (в дополнение к ч. 2.1) содержать диапазоны значений полной стоимости кредита по видам кредита С ИСПОЛЬЗОВАНИЕМ СЛОВ «полная стоимость кредита (займа)» — одной аббревиатуры «ПСК» недостаточно. Эта информация размещается ДО информации о ставках и шрифтом не меньше шрифта ставок.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/0021818db8b93ae5fbd38076074a7182e157186c/"},"fz38_st28_3_1_warning":{"law":"ФЗ «О рекламе» № 38-ФЗ (введена 479-ФЗ от 26.12.2024)","article":"ст. 28, ч. 3.1","title":"Предупреждение «Оценивайте свои финансовые возможности и риски»","summary":"Реклама услуг, связанных с предоставлением потребительского кредита (займа), пользованием им и его погашением, должна содержать предупреждение «Оценивайте свои финансовые возможности и риски» (радио ≥3 сек; ТВ/видео ≥3 сек и ≥5% площади кадра; иные способы ≥5% рекламной площади).","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/0021818db8b93ae5fbd38076074a7182e157186c/"},"fz38_st28_3_2_mortgage":{"law":"ФЗ «О рекламе» № 38-ФЗ (введена 479-ФЗ от 26.12.2024)","article":"ст. 28, ч. 3.2","title":"Распространение требований на ипотечные кредиты физлицам","summary":"Правила ч. 2.1, 3 и 3.1 ст. 28 применяются также к рекламе кредитов (займов) физическим лицам не для предпринимательской деятельности, обязательства по которым обеспечены ипотекой.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/0021818db8b93ae5fbd38076074a7182e157186c/"},"fz38_st28_bankruptcy":{"law":"ФЗ «О рекламе» № 38-ФЗ (ст. 28.1, введена 332-ФЗ от 31.07.2025)","article":"ст. 28.1","title":"Реклама услуг, связанных с процедурой банкротства","summary":"С 01.01.2026 реклама услуг по банкротству граждан (снижение/прекращение задолженности) НЕ должна содержать: гарантии/обещания освобождения от денежных обязательств; призыв не исполнять обязательства; утверждение о создании государством системы освобождения от долгов; упоминание о возможности освобождения от обязательств. Должна содержать указание: «Банкротство влечёт негативные последствия, в том числе ограничения на получение кредита и повторное банкротство в течение пяти лет. Предварительно обратитесь к своему кредитору и в МФЦ.» (радио ≥3 сек; ТВ/видео ≥3 сек и ≥7% кадра; иное ≥7% площади).","url":"https://www.consultant.ru/legalnews/29175/"},"fz38_st29":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 29","title":"Реклама ценных бумаг","summary":"Реклама ценных бумаг должна содержать сведения о лицах, обязавшихся по ценным бумагам; запрещено обещание выплаты дивидендов/дохода, если размер не определён, и прогнозы роста курсовой стоимости.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz38_st18_1":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 18.1","title":"Маркировка интернет-рекламы (ERID)","summary":"Реклама в сети «Интернет», направленная на потребителей на территории РФ, должна содержать пометку «реклама», указание на рекламодателя (или сайт с информацией о нём) и уникальный идентификатор рекламы (erid), присвоенный оператором рекламных данных (ОРД). Сведения о рекламе передаются в Единый реестр интернет-рекламы (ЕРИР) через ОРД.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz436_age":{"law":"ФЗ № 436-ФЗ «О защите детей от информации…»","article":"ст. 6, ст. 11","title":"Возрастная маркировка информационной продукции","summary":"Информационная продукция, в т.ч. распространяемая с рекламой, подлежит возрастной классификации со знаком информационной продукции (0+, 6+, 12+, 16+, 18+) в установленных законом случаях.","url":"https://www.consultant.ru/document/cons_doc_LAW_108808/"},"fz152_pdn":{"law":"ФЗ № 152-ФЗ «О персональных данных»","article":"ст. 6, ст. 9","title":"Обработка персональных данных","summary":"Сбор персональных данных (имя, телефон, e-mail через формы) требует правового основания, как правило — согласия субъекта. Необходимы политика обработки ПДн и получение согласия до сбора данных.","url":"https://www.consultant.ru/document/cons_doc_LAW_61801/"},"zpp_info":{"law":"Закон РФ № 2300-1 «О защите прав потребителей»","article":"ст. 8–10","title":"Право потребителя на достоверную информацию","summary":"Потребителю должна предоставляться необходимая и достоверная информация о товарах (работах, услугах), обеспечивающая возможность их правильного выбора.","url":"https://www.consultant.ru/document/cons_doc_LAW_305/"},"fz38_st8":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 8","title":"Реклама товаров при дистанционной продаже","summary":"В рекламе товаров при дистанционном способе продажи должны быть указаны сведения о продавце: для юрлица — наименование, место нахождения и ОГРН; для ИП — ФИО и ОГРНИП; для самозанятого — ФИО и ИНН.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz38_st9":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 9","title":"Реклама о проведении стимулирующих мероприятий","summary":"В рекламе конкурса, игры, розыгрыша, условием участия в которых является покупка товара, должны быть указаны: сроки проведения; источник информации об организаторе, правилах, количестве призов/выигрышей, сроках, месте и порядке их получения.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz38_st16":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 16","title":"Реклама в периодических печатных изданиях","summary":"Размещение текста рекламы в изданиях, не специализирующихся на рекламе, должно сопровождаться пометкой «реклама» или «на правах рекламы».","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz38_st18":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 18","title":"Реклама по сетям электросвязи (СМС, звонки, email)","summary":"Распространение рекламы по сетям электросвязи (в т.ч. SMS, автодозвон, email) допускается только при предварительном согласии абонента/адресата. Реклама должна немедленно прекращаться по требованию лица, которому она адресована.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz38_st25_1":{"law":"ФЗ «О рекламе» № 38-ФЗ (ст. 25.1, введена 393-ФЗ от 27.10.2025)","article":"ст. 25.1","title":"Реклама безалкогольных тонизирующих (энергетических) напитков","summary":"Реклама энергетических напитков не должна обращаться к несовершеннолетним и содержать информацию о наличии в них БАД и витаминов. В каждом случае должна сопровождаться предупреждением о вреде чрезмерного потребления (радио ≥3 сек; ТВ/видео ≥5 сек и ≥7% кадра; иное ≥7% площади).","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz38_st26":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 26","title":"Реклама продукции военного назначения и оружия","summary":"Не допускается реклама продукции военного назначения (кроме ВТС) и оружия, не указанного в ч. 3–5 ст. 26. Реклама служебного, боевого, гражданского оружия допускается только в специализированных изданиях, местах производства/реализации и стрельбищах, с соблюдением ограничений.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz38_st28_forex":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 28, ч. 5.1","title":"Реклама сделок с форекс-дилерами","summary":"Реклама, побуждающая к заключению сделок с форекс-дилерами, должна содержать указание: «Предлагаемые к заключению договоры или финансовые инструменты являются высокорискованными и могут привести к потере внесенных денежных средств в полном объеме. До совершения сделок следует ознакомиться с рисками, с которыми они связаны.».","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/0021818db8b93ae5fbd38076074a7182e157186c/"},"fz38_st29_1":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 29.1","title":"Реклама цифровых финансовых активов (ЦФА)","summary":"Реклама выпускаемых ЦФА должна содержать: наименование лица, выпускающего ЦФА; адрес сайта с решением о выпуске; сведения о максимальной сумме для неквалифи- цированных инвесторов; указание на то, что ЦФА являются высокорискованными и их приобретение может привести к потере средств в полном объеме.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"},"fz38_st30":{"law":"ФЗ «О рекламе» № 38-ФЗ","article":"ст. 30","title":"Реклама услуг по договорам ренты и пожизненного содержания","summary":"Реклама услуг по договорам ренты (пожизненного содержания с иждивением) не должна содержать: благодарности заключивших договоры; утверждения о преимуществах перед завещанием; осуждения родственников потребителя; упоминания о подарках. Посредник обязан указать, что плательщиком ренты будет другое лицо.","url":"https://www.consultant.ru/document/cons_doc_LAW_58968/"}},"liability":{"koap_14_3_1":{"koap_article":"ст. 14.3, ч. 1 КоАП РФ","title":"Нарушение законодательства о рекламе (общий состав)","fine_citizens":"от 2 000 до 2 500 ₽","fine_officials":"от 4 000 до 20 000 ₽","fine_legal":"от 100 000 до 500 000 ₽","note":"Общий состав, применяется, если нет специальной части ст. 14.3.","url":"https://www.consultant.ru/document/cons_doc_LAW_34661/2d50fc1c4013ea9ab20b8b2666c1650b1dc4c982/"},"koap_14_3_15":{"koap_article":"ст. 14.3, ч. 15 КоАП РФ","title":"Непредоставление/недостоверные сведения о рекламе в ЕРИР (РКН)","fine_citizens":"от 10 000 до 30 000 ₽","fine_officials":"от 30 000 до 100 000 ₽","fine_legal":"от 200 000 до 500 000 ₽","note":"Неисполнение обязанности по передаче сведений о интернет-рекламе в Роскомнадзор (ЕРИР), нарушение сроков либо неполная/недостоверная информация.","url":"https://www.consultant.ru/document/cons_doc_LAW_34661/2d50fc1c4013ea9ab20b8b2666c1650b1dc4c982/"},"koap_14_3_16":{"koap_article":"ст. 14.3, ч. 16 КоАП РФ","title":"Распространение интернет-рекламы без идентификатора (erid)","fine_citizens":"от 30 000 до 100 000 ₽","fine_officials":"от 100 000 до 200 000 ₽","fine_legal":"от 200 000 до 500 000 ₽","note":"Распространение рекламы в сети «Интернет» без присвоенного идентификатора рекламы либо нарушение требований к его размещению.","url":"https://www.consultant.ru/document/cons_doc_LAW_34661/2d50fc1c4013ea9ab20b8b2666c1650b1dc4c982/"},"koap_14_3_2_5":{"koap_article":"ст. 14.3, ч. 2–5 КоАП РФ","title":"Нарушение специальных требований (алкоголь, лекарства, БАД, финуслуги и т.п.)","fine_citizens":"от 2 000 до 4 000 ₽","fine_officials":"от 10 000 до 25 000 ₽","fine_legal":"от 200 000 до 500 000 ₽","note":"Повышенная ответственность за нарушение требований к рекламе отдельных видов товаров. Конкретная часть зависит от категории — уточните по КоАП.","url":"https://www.consultant.ru/document/cons_doc_LAW_34661/2d50fc1c4013ea9ab20b8b2666c1650b1dc4c982/"},"koap_14_3_1_tobacco":{"koap_article":"ст. 14.3.1 КоАП РФ","title":"Реклама табака, стимулирование продажи, спонсорство","fine_citizens":"от 2 000 до 3 000 ₽","fine_officials":"от 10 000 до 20 000 ₽","fine_legal":"от 150 000 до 600 000 ₽","note":"Ответственность за рекламу табачной и никотинсодержащей продукции.","url":"https://www.consultant.ru/document/cons_doc_LAW_34661/"},"koap_14_3_fin":{"koap_article":"ст. 14.3 КоАП РФ","title":"Нарушение требований к рекламе финансовых услуг","fine_citizens":"от 2 000 до 2 500 ₽","fine_officials":"от 4 000 до 20 000 ₽","fine_legal":"от 100 000 до 500 000 ₽","note":"Нарушение требований ст. 28 (финуслуги, кредиты, вклады, инвестиции, банкротство). Конкретная часть ст. 14.3 зависит от состава — уточните по КоАП; за рекламу банкротства с 2026 г. отвечает в т.ч. рекламораспространитель.","url":"https://www.consultant.ru/document/cons_doc_LAW_34661/2d50fc1c4013ea9ab20b8b2666c1650b1dc4c982/"},"koap_13_11_pdn":{"koap_article":"ст. 13.11 КоАП РФ","title":"Нарушение законодательства о персональных данных","fine_citizens":"от 6 000 до 10 000 ₽","fine_officials":"от 20 000 до 40 000 ₽","fine_legal":"от 60 000 до 100 000 ₽","note":"Обработка ПДн без согласия/правового основания (ч. 2 ст. 13.11). Размеры зависят от состава; за отсутствие согласия предусмотрены повышенные штрафы.","url":"https://www.consultant.ru/document/cons_doc_LAW_34661/"}},"practice":{"superlative":[{"type":"ФАС","reference":"Практика ФАС по ст. 5 ч. 3 ФЗ-38","summary":"Использование в рекламе слов «№1», «лучший», «самый» без указания критерия сравнения и документального подтверждения систематически признаётся ФАС недостоверной рекламой. Требуется ссылка на объективный источник (напр., исследование, рейтинг с методологией).","url":"https://fas.gov.ru/"}],"comparison":[{"type":"ФАС","reference":"Практика ФАС по некорректному сравнению (ст. 5 ч. 2)","summary":"Сравнение «лучше, чем у конкурентов» без конкретных измеримых параметров и подтверждения признаётся некорректным сравнением и недобросовестной рекламой.","url":"https://fas.gov.ru/"}],"erid_missing":[{"type":"ФАС/РКН","reference":"Практика по ст. 18.1 ФЗ-38 и ст. 14.3 ч.15–16 КоАП","summary":"С 2023 года ФАС и Роскомнадзор активно штрафуют за интернет-рекламу без маркировки (erid, пометка «реклама», указание рекламодателя) и за непередачу сведений в ЕРИР. Штрафы налагаются на каждое рекламное сообщение.","url":"https://rkn.gov.ru/"}],"medicine":[{"type":"ФАС","reference":"Практика ФАС по ст. 24 ФЗ-38","summary":"Отсутствие предупреждения о противопоказаниях и необходимости консультации специалиста, а также утверждения о гарантированном излечении — частые основания для штрафов за рекламу лекарств и медуслуг.","url":"https://fas.gov.ru/"}],"bad":[{"type":"ФАС","reference":"Практика ФАС по ст. 25 ФЗ-38","summary":"Реклама БАД, создающая впечатление лекарственного средства («лечит», «избавляет от болезни») без предупреждения «не является лекарственным средством», признаётся нарушением.","url":"https://fas.gov.ru/"}],"credit":[{"type":"ФАС","reference":"Практика ФАС по ст. 28 ФЗ-38 (кредиты)","summary":"Реклама кредита с указанием одной привлекательной ставки без раскрытия полной стоимости кредита (ПСК) и прочих условий признаётся нарушением. С 01.03.2025 обязательны предупреждение «Оценивайте свои финансовые возможности и риски» и призыв изучить все условия; мелкий шрифт существенных условий — введение в заблуждение.","url":"https://fas.gov.ru/"}],"deposit":[{"type":"ФАС","reference":"Практика ФАС по ст. 28 ч. 2 п. 2 (вклады)","summary":"Дело о рекламе вклада «Супер-вклад 12%»: указана ставка, но не раскрыты все условия, влияющие на доходность (срок, сумма, капитализация). ФАС признала нарушением умолчание об условиях при указании хотя бы одного из них.","url":"https://www.consultant.ru/legalnews/26713/"}],"investment":[{"type":"ФАС","reference":"Практика ФАС по ст. 28 ч. 2 п. 1 (инвестиции)","summary":"Обещание гарантированной доходности инвестиций/вложений, если она не может быть определена на момент договора, признаётся нарушением. Прогнозы дохода на основе прошлых показателей также рискованны.","url":"https://fas.gov.ru/"}],"bankruptcy":[{"type":"ФАС","reference":"Ст. 28 ФЗ-38 (332-ФЗ), с 01.01.2026","summary":"Реклама услуг по банкротству граждан без предупреждения о негативных последствиях и с обещанием «гарантированного списания долгов» / «законно не платить» — нарушение; ответственность несёт в т.ч. рекламораспространитель.","url":"https://www.consultant.ru/legalnews/29175/"}],"alcohol":[{"type":"ФАС","reference":"Практика ФАС по ст. 21 ФЗ-38","summary":"Любая реклама алкоголя в сети «Интернет» запрещена; штрафуется размещение постов, баннеров и упоминаний со ссылкой на приобретение.","url":"https://fas.gov.ru/"}],"tobacco":[{"type":"ФАС","reference":"Практика ФАС/ст. 14.3.1 КоАП","summary":"Реклама вейпов, электронных сигарет, жидкостей и устройств для потребления никотина запрещена; штрафуется в т.ч. продвижение в соцсетях и у блогеров.","url":"https://fas.gov.ru/"}],"age_marking":[{"type":"ФАС","reference":"Практика ФАС по ст. 11 ФЗ-38 и 436-ФЗ","summary":"Возрастной знак (0+…18+) в рекламе обязателен, только если объект рекламы — информационная продукция, подлежащая маркировке по 436-ФЗ (сетевые издания/СМИ, фильмы, книги, игры, зрелищные мероприятия). Реклама обычных товаров и услуг возрастной маркировки не требует.","url":"https://www.consultant.ru/law/podborki/vozrastnye_ogranicheniya_v_reklame/"}]},"categories":{"alcohol":{"title":"Алкогольная продукция","keywords":["алкоголь","водка","вино","винный","пиво","пивной","коньяк","виски","ром","текила","джин","ликёр","ликер","шампанское","игристое","вермут","бренди","сидр","алкогольный","крепкий напиток","бар","винотека"],"law_refs":["fz38_st21"],"liability_refs":["koap_14_3_2_5"],"practice_refs":["alcohol"],"required_disclaimers":[{"id":"alcohol_harm_warning","text":"Предупреждение о вреде чрезмерного потребления алкоголя (≥10% площади)","patterns":["чрезмерное употребление","вред","вредит вашему здоровью"]}],"prohibitions":["Реклама алкоголя в сети «Интернет» полностью запрещена","Запрещено обращение к несовершеннолетним и использование их образов","Запрещено утверждать о пользе алкоголя для здоровья"],"risk_level":"critical"},"tobacco":{"title":"Табак, вейпы, никотинсодержащая продукция","keywords":["сигарета","сигареты","табак","табачный","вейп","вейпинг","электронная сигарета","электронные сигареты","кальян","никотин","никотиновый","жидкость для вейпа","iqos","айкос","снюс","нюха const ORDER = { low: 1, medium: 2, high: 3, critical: 4 };
const LEVEL_RU = { low: "Низкий", medium: "Средний", high: "Высокий", critical: "Критический" };
const RISK_EMOJI = { low: "🟢", medium: "🟡", high: "🟠", critical: "🔴" };
const SUFFIXES = ["ыми","ими","ого","его","ому","ему","ая","яя","ое","ее","ые","ий","ый",
  "ых","их","ом","ем","ов","ев","ам","ям","ах","ях","ой","ей","у","ю","а","я","ы","и","е","о","ь"];

function tokens(t){ return (t.toLowerCase().match(/[а-яёa-z0-9]+/g) || []); }
function stem(w){ for(const s of SUFFIXES){ if(w.length-s.length>=3 && w.endsWith(s)) return w.slice(0,w.length-s.length); } return w; }
function lemmaTerm(term){ const t=tokens(term); return t.length ? stem(t[0]) : term.toLowerCase(); }
function snippet(text, idx, len){ const r=42; const a=Math.max(0,idx-r), b=Math.min(text.length,idx+len+r);
  return (a>0?"…":"") + text.slice(a,b).trim() + (b<text.length?"…":""); }

function lawsFor(keys){ return (keys||[]).map(k=>KB.laws[k]).filter(Boolean); }
function liabilityFor(keys){ for(const k of (keys||[])){ if(KB.liability[k]) return KB.liability[k]; } return null; }
function practiceFor(keys){ let r=[]; for(const k of (keys||[])){ if(KB.practice[k]) r=r.concat(KB.practice[k]); } return r; }

function mk(id, cat, title, desc, risk, lawRefs, liabRefs, practiceRefs, fix, evidence, source){
  return { id, category: cat, title, description: desc, risk_level: risk,
    legal_basis: lawsFor(lawRefs), liability: liabilityFor(liabRefs), practice: practiceFor(practiceRefs),
    mitigation: fix || [], evidence: evidence || null, source: source || "Правило" };
}

function detectCategories(text, stemSet){
  const low = text.toLowerCase(); const found = [];
  for(const key in KB.categories){ const c = KB.categories[key]; let hit=false;
    for(const kw of (c.keywords||[])){
      if(kw.includes(" ") || kw.includes("-")){ if(low.includes(kw.toLowerCase())){ hit=true; break; } }
      else { if(stemSet.has(lemmaTerm(kw))){ hit=true; break; } }  // однословные — только целым словом
    }
    // Подстроки для слитных форм («Супервклад», «Мегадепозит»), с исключениями («вкладка»).
    if(!hit && (c.keyword_substrings||[]).length){
      const subs = c.keyword_substrings.map(s=>s.toLowerCase());
      const excl = (c.keyword_substrings_exclude||[]).map(s=>s.toLowerCase());
      for(const tok of (low.match(/[а-яёa-z]+/g) || [])){
        if(excl.some(x=>tok.startsWith(x))) continue;
        if(subs.some(s=>tok.includes(s))){ hit=true; break; }
      }
    }
    if(hit) found.push(key);
  }
  return found;
}

function runGeneralRules(text, stemSet, low, isInternet){
  const out = [];
  for(const id in KB.rules){ const r = KB.rules[id]; let matched=false, ev=null; const type=r.type;
    if(type === "lemma_any"){
      const termLemmas = {};
      for(const t of (r.terms||[])){ const l=lemmaTerm(t); if(l.length>=3 && !/^\d+$/.test(l)) termLemmas[l]=t; }
      const hit = Object.keys(termLemmas).find(l=>stemSet.has(l));
      if(hit){ matched=true; ev=termLemmas[hit]; }
      if(!matched){ for(const p of (r.extra_phrases||[])){ const i=low.indexOf(p.toLowerCase()); if(i>=0){ matched=true; ev=snippet(text,i,p.length); break; } } }
    } else if(type === "phrase_any"){
      for(const p of (r.terms||[])){ const i=low.indexOf(p.toLowerCase()); if(i>=0){ matched=true; ev=snippet(text,i,p.length); break; } }
    } else if(type === "regex_any"){
      for(const p of (r.patterns_regex||[])){ const m=text.match(new RegExp(p,"i")); if(m){ matched=true; ev=snippet(text,m.index,m[0].length); break; } }
    } else if(type === "absent_all"){
      // Маркировка ERID/«реклама» (ст. 18.1) — только для интернет-рекламы.
      if(!isInternet){ continue; }
      const any = (r.patterns_regex||[]).some(p=>new RegExp(p,"i").test(text));
      if(!any){ matched=true; ev=null; }
    } else if(type === "conditional"){
      // Триггер: любая фраза trigger_patterns ЛИБО в каждой группе trigger_groups
      // есть совпадение (ловит «купи … онлайн» с любыми словами между).
      let trig = (r.trigger_patterns||[]).find(t=>low.includes(t.toLowerCase()));
      if(!trig && (r.trigger_groups||[]).length){
        let ok=true, last=null;
        for(const g of r.trigger_groups){ const h=g.find(p=>low.includes(p.toLowerCase())); if(!h){ ok=false; break; } last=h; }
        if(ok) trig=last;
      }
      if(trig && !(r.required_patterns||[]).some(x=>low.includes(x.toLowerCase()))){ matched=true; const i=low.indexOf(trig.toLowerCase()); ev=snippet(text,i,trig.length); }
    }
    if(matched) out.push(mk(id, id, r.title, r.description, r.risk_level, r.law_refs, r.liability_refs, r.practice_refs, r.mitigation, ev));
  }
  return out;
}

function label(item, fallback){ const l=item.label; if(l) return l; const t=(fallback||"").trim(); return t.length<=70 ? t : t.slice(0,69).trim()+"…"; }

function runCategoryRules(text, cats, low){
  const out = [];
  for(const key of cats){ const c = KB.categories[key]; const title = c.title || key; const proh = c.prohibitions || [];
    // Карточка категории — только если есть неповторяющийся контекст (непустой prohibitions).
    if(proh.length) out.push(mk("category_"+key, key, "Особый правовой режим: "+title,
      "Реклама категории «"+title+"». Обратите внимание на специальные требования законодательства о рекламе:",
      c.risk_level||"medium", c.law_refs, c.liability_refs, c.practice_refs, proh.slice(), null));
    for(const d of (c.required_disclaimers||[])){
      const present = (d.patterns||[]).some(p=>low.includes(p.toLowerCase()));
      if(!present) out.push(mk("disclaimer_"+key+"_"+d.id, key, "Не указано обязательное: "+label(d,d.text),
        "Категория «"+title+"». Не обнаружено обязательное: "+d.text+".", d.risk_level||c.risk_level||"medium",
        d.law_refs||c.law_refs, c.liability_refs, c.practice_refs, ["Добавьте: "+d.text], null));
    }
    for(const d of (c.conditional_disclaimers||[])){
      const trig = (d.trigger_patterns||[]).find(t=>low.includes(t.toLowerCase()));
      const sat = (d.required_patterns||[]).some(x=>low.includes(x.toLowerCase()));
      if(trig && !sat){ const i=low.indexOf(trig.toLowerCase());
        out.push(mk("cond_"+key+"_"+d.id, key, "Не раскрыто обязательное: "+label(d,d.text),
          "Категория «"+title+"». В рекламе указано условие «"+trig+"», но отсутствует обязательное раскрытие: "+d.text+".",
          d.risk_level||c.risk_level||"medium", d.law_refs||c.law_refs, c.liability_refs, c.practice_refs, ["Добавьте: "+d.text], snippet(text,i,trig.length))); }
    }
    for(const fp of (c.forbidden_patterns||[])){
      const hit = (fp.patterns||[]).find(p=>low.includes(p.toLowerCase()));
      if(hit){ const i=low.indexOf(hit.toLowerCase());
        out.push(mk("forbidden_"+key+"_"+fp.id, key, "Запрещённая формулировка: "+label(fp,fp.text),
          "Категория «"+title+"». "+(fp.text || "Обнаружена запрещённая формулировка."), fp.risk_level || c.risk_level || "high",
          fp.law_refs||c.law_refs, c.liability_refs, c.practice_refs, ["Удалите или переформулируйте: "+(fp.text||"")], snippet(text,i,hit.length))); }
    }
  }
  return out;
}

function analyze(text, channel){
  channel = channel || "internet";
  const isInternet = channel === "internet";
  const low = text.toLowerCase(); const stemSet = new Set(tokens(text).map(stem));
  const cats = detectCategories(text, stemSet);
  let f = runGeneralRules(text, stemSet, low, isInternet).concat(runCategoryRules(text, cats, low));
  const seen = new Set(); const uniq = [];
  for(const x of f){ const k=x.title.toLowerCase()+"|"+((x.evidence||"").toLowerCase()); if(seen.has(k)) continue; seen.add(k); uniq.push(x); }
  uniq.sort((a,b)=>ORDER[b.risk_level]-ORDER[a.risk_level] || (a.source==="Правило"?-1:1));
  const overall = uniq.length ? uniq.reduce((m,x)=>ORDER[x.risk_level]>ORDER[m]?x.risk_level:m, "low") : "low";
  return { overall, findings: uniq, cats, channel, isInternet };
}

function practiceHtml(list){ return list.map(p=>'<p><b>'+esc(p.type)+':</b> '+esc(p.reference||"")+
  '<span class="law-sum" style="display:block">'+esc(p.summary||"")+'</span></p>').join(""); }

function render(res){
  const rep = document.getElementById("report");
  const counts = { critical:0, high:0, medium:0, low:0 }; res.findings.forEach(f=>counts[f.risk_level]++);
  const n = res.findings.length;
  const dots = lvl => { const on=ORDER[lvl]; return [3,2,1].map(v=>'<span class="light__dot'+(on===v?" light__dot--on":"")+'"></span>').join(""); };
  const sub = n===0 ? "Явных правовых рисков движок не обнаружил. Рекомендуется финальная проверка юристом."
    : "Выявлено рисков: "+n+" ("+RISK_EMOJI.critical+counts.critical+" "+RISK_EMOJI.high+counts.high+" "+RISK_EMOJI.medium+counts.medium+" "+RISK_EMOJI.low+counts.low+"). Проверьте каждый пункт ниже.";

  let html = '<button class="ghost" id="exportBtn" style="margin-bottom:12px">🖨 Скачать PDF / печать</button>';
  html += '<div class="hero hero--'+res.overall+'"><div class="light light--'+res.overall+'">'+dots(res.overall)+'</div>'+
    '<div><div class="hero__label">Итоговый уровень риска</div><div class="hero__level hero__level--'+res.overall+'">'+LEVEL_RU[res.overall]+'</div><div class="hero__sub">'+esc(sub)+'</div></div></div>';
  html += '<div class="counts">'+["critical","high","medium","low"].map(k=>'<span class="count"><span class="swatch" style="background:var(--'+k+')"></span>'+LEVEL_RU[k]+': <b>'+counts[k]+'</b></span>').join("")+'</div>';
  if(res.cats.length) html += '<div class="chips"><span class="eyebrow">Категории:</span>'+res.cats.map(c=>'<span class="chip">'+esc(KB.categories[c].title)+'</span>').join("")+'</div>';
  if(!res.isInternet){ const CH={sms:"СМС / рассылка",tv:"ТВ",radio:"Радио",print:"Печать",outdoor:"Наружная",email:"E-mail"};
    html += '<div class="chan-note">Канал: <b>'+esc(CH[res.channel]||res.channel)+'</b>. Риски маркировки интернет-рекламы (ERID, пометка «реклама») не показаны — ст. 18.1 применяется только к рекламе в сети «Интернет». Для СМС/рассылок действует ст. 18 (предварительное согласие абонента).</div>'; }

  if(n===0){ html += '<div class="empty">✅ Явных нарушений не найдено. Это не заменяет проверку юристом.</div>'; }
  else {
    html += '<div class="section-label">Найденные риски — по убыванию серьёзности</div><div class="findings">';
    res.findings.forEach((f,i)=>{
      html += '<article class="finding finding--'+f.risk_level+'"><div class="f-head"><span class="f-num">'+(i+1)+'</span>'+
        '<h3 class="f-title">'+esc(f.title)+'</h3><div class="f-tags"><span class="badge badge--'+f.risk_level+'">'+LEVEL_RU[f.risk_level]+'</span><span class="src">'+esc(f.source)+'</span></div></div>';
      html += '<p class="f-desc">'+esc(f.description)+'</p>';
      if(f.evidence) html += '<div class="evidence"><span class="eyebrow">Фрагмент рекламы</span>«'+esc(f.evidence)+'»</div>';
      html += '<div class="grid">';
      if(f.legal_basis.length) html += '<div class="block"><h4>📖 Правовое основание</h4>'+lawHtml(f.legal_basis)+'</div>';
      if(f.liability) html += '<div class="block"><h4>⚖️ Ответственность</h4>'+finesHtml(f.liability)+'</div>';
      if(f.mitigation.length) html += '<div class="block"><h4>🛠 Меры минимизации</h4><ul>'+f.mitigation.map(m=>'<li>'+esc(m)+'</li>').join("")+'</ul></div>';
      if(f.practice.length) html += '<div class="block"><h4>🏛 Практика ФАС / судов</h4>'+practiceHtml(f.practice)+'</div>';
      html += '</div></article>';
    });
    html += '</div>';
  }
  html += '<div class="disclaimer">⚠️ '+esc(KB.disclaimer)+'</div>';
  rep.innerHTML = html;
  const eb = document.getElementById("exportBtn"); if(eb) eb.onclick = ()=>window.print();
  rep.scrollIntoView({ behavior:"smooth", block:"start" });
}

/* ---------- События ---------- */
const EXAMPLE = "Наш банк — №1 в России! Кредит наличными от 5% годовых без справок. Вклад с гарантированной ставкой 12% годовых. Оставьте заявку — перезвоним за 5 минут!";
document.getElementById("checkBtn").onclick = ()=>{ const t=document.getElementById("input").value.trim(); if(!t) return; const ch=document.getElementById("channel").value; render(analyze(t, ch)); };
document.getElementById("exampleBtn").onclick = ()=>{ document.getElementById("input").value = EXAMPLE; };
document.getElementById("input").addEventListener("keydown", e=>{ if((e.ctrlKey||e.metaKey) && e.key==="Enter") document.getElementById("checkBtn").click(); });

</script>
</body>
</html>
