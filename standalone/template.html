<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ПравоРеклама — проверка рекламы на правовые риски РФ</title>
<style>
  :root{
    --bg:#eef1f7;--surface:#fff;--surface-2:#f7f9fd;--border:#e2e6f0;--text:#172033;
    --muted:#5c6678;--primary:#2c4bd8;--primary-ink:#1f37a8;--primary-weak:#eaeefb;
    --low:#278a4f;--medium:#b5870a;--high:#d95f0b;--critical:#d0302c;
    --low-bg:#e7f4ec;--medium-bg:#fbf1dc;--high-bg:#fdeadd;--critical-bg:#fbe6e5;
    --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(20,30,60,.06),0 10px 30px rgba(20,30,60,.07);--radius:14px;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0d1320;--surface:#151d2c;--surface-2:#1b2434;--border:#29344a;--text:#e7ecf6;
    --muted:#94a1b8;--primary:#6d8bff;--primary-ink:#9db3ff;--primary-weak:#1d2947;
    --low:#4bbd76;--medium:#e0af23;--high:#f5842c;--critical:#f0524d;
    --low-bg:#16281e;--medium-bg:#2a2312;--high-bg:#2c1d11;--critical-bg:#2c1614;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.4);
  }}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--font-sans);color:var(--text);line-height:1.55;
    background:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--primary) 8%,transparent),transparent 60%),var(--bg);
    min-height:100vh;padding:0 16px 72px;-webkit-font-smoothing:antialiased;
  }
  .container{max-width:860px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 4px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:13px}
  .brand__mark{width:46px;height:46px;flex:none;display:grid;place-items:center;font-size:24px;border-radius:12px;
    background:linear-gradient(150deg,var(--primary),var(--primary-ink));box-shadow:var(--shadow);color:#fff}
  .brand__name{font-size:20px;font-weight:750;letter-spacing:-.02em}
  .brand__tag{font-size:12.5px;color:var(--muted);margin-top:1px}
  .mode{font-size:12px;font-weight:650;padding:6px 13px;border-radius:999px;background:var(--primary-weak);
    color:var(--primary-ink);border:1px solid color-mix(in srgb,var(--primary) 22%,transparent)}
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .panel{padding:18px 20px;margin-bottom:18px}
  .panel .eyebrow{display:block;margin-bottom:8px}
  textarea{width:100%;border:1px solid var(--border);border-radius:11px;padding:13px 15px;font-size:15px;
    font-family:inherit;color:var(--text);background:var(--surface-2);resize:vertical;outline:none;min-height:130px}
  textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
  .actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px;flex-wrap:wrap}
  .channel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .channel select{font-family:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
  .chan-note{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
  .btn{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:11px 26px;font-size:15px;
    font-weight:650;cursor:pointer}
  .btn:hover{background:var(--primary-ink)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .linkbtn{background:none;border:none;color:var(--primary);cursor:pointer;font-size:13px;padding:0}
  .ghost{background:transparent;color:var(--primary);border:1px solid var(--primary);padding:9px 18px;font-size:14px;border-radius:10px;cursor:pointer;font-weight:650}
  .ghost:hover{background:var(--primary-weak)}

  .hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;padding:22px 24px;border-radius:var(--radius);margin-bottom:14px;border:1px solid var(--border)}
  .hero--low{background:var(--low-bg);border-color:color-mix(in srgb,var(--low) 30%,transparent)}
  .hero--medium{background:var(--medium-bg);border-color:color-mix(in srgb,var(--medium) 30%,transparent)}
  .hero--high{background:var(--high-bg);border-color:color-mix(in srgb,var(--high) 30%,transparent)}
  .hero--critical{background:var(--critical-bg);border-color:color-mix(in srgb,var(--critical) 30%,transparent)}
  .light{display:flex;flex-direction:column;gap:6px;align-items:center}
  .light__dot{width:15px;height:15px;border-radius:50%;background:currentColor;opacity:.22}
  .light__dot--on{opacity:1;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 22%,transparent)}
  .light--low{color:var(--low)}.light--medium{color:var(--medium)}.light--high{color:var(--high)}.light--critical{color:var(--critical)}
  .hero__label{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .hero__level{font-size:25px;font-weight:780;letter-spacing:-.01em}
  .hero__level--low{color:var(--low)}.hero__level--medium{color:var(--medium)}.hero__level--high{color:var(--high)}.hero__level--critical{color:var(--critical)}
  .hero__sub{font-size:14px;margin-top:3px}

  .counts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .count{font-size:12.5px;font-weight:650;padding:5px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--border);background:var(--surface);font-variant-numeric:tabular-nums}
  .count .swatch{width:9px;height:9px;border-radius:50%}
  .chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .chip{font-size:12.5px;font-weight:650;padding:5px 12px;border-radius:8px;background:var(--primary-weak);color:var(--primary-ink)}
  .section-label{font-size:13px;font-weight:700;color:var(--muted);margin:0 4px 12px}

  .findings{display:flex;flex-direction:column;gap:15px}
  .finding{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px 20px 20px;overflow:hidden}
  .finding::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
  .finding--high::before{background:var(--high)}.finding--medium::before{background:var(--medium)}
  .finding--low::before{background:var(--low)}.finding--critical::before{background:var(--critical)}
  .f-head{display:flex;align-items:flex-start;gap:11px;flex-wrap:wrap}
  .f-num{width:25px;height:25px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:750;border-radius:50%;
    background:var(--primary-weak);color:var(--primary-ink);font-variant-numeric:tabular-nums}
  .f-title{font-size:16.5px;font-weight:700;margin:0;flex:1;min-width:190px;letter-spacing:-.01em;text-wrap:balance}
  .f-tags{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:750;padding:4px 11px;border-radius:999px;color:#fff}
  .badge--high{background:var(--high)}.badge--medium{background:var(--medium)}.badge--low{background:var(--low)}.badge--critical{background:var(--critical)}
  .src{font-size:11px;font-weight:650;padding:4px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
  .f-desc{font-size:14.5px;margin:12px 0 0}
  .evidence{margin:13px 0 0;padding:11px 14px;border-radius:0 9px 9px 0;background:var(--surface-2);
    border-left:3px solid var(--muted);font-family:var(--font-mono);font-size:13px}
  .evidence .eyebrow{display:block;margin-bottom:5px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:15px}
  .block{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:13px 15px}
  .block h4{margin:0 0 9px;font-size:12.5px;font-weight:750}
  .block p,.block li{font-size:13px;margin:0}
  .block ul{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:6px}
  .law-ref{font-weight:700}.law-sum{color:var(--muted);font-size:12px;margin-top:4px}
  .fines{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:4px}
  .fines li{display:flex;justify-content:space-between;gap:12px;font-size:12.5px}
  .fines .amt{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
  .link{color:var(--primary);text-decoration:none;font-size:12px;font-weight:600}
  .link:hover{text-decoration:underline}
  .empty{margin-top:16px;background:var(--low-bg);color:var(--low);padding:20px;border-radius:var(--radius);text-align:center;font-weight:650}
  .disclaimer{margin-top:26px;padding:15px 18px;border-radius:12px;font-size:12.5px;color:var(--muted);
    background:var(--surface);border:1px dashed var(--border)}
  .footer{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
  .hidden{display:none}
  @media (max-width:620px){.grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}}
  @media print{.top .mode,.panel,.footer,#exportBtn{display:none!important}.finding,.hero,.badge,.chip{-webkit-print-color-adjust:exact;print-color-adjust:exact}.finding{break-inside:avoid}}
</style>
</head>
<body>
<div class="container">
  <header class="top">
    <div class="brand">
      <div class="brand__mark">⚖️</div>
      <div>
        <div class="brand__name">ПравоРеклама</div>
        <div class="brand__tag">Проверка рекламы на правовые риски · законодательство РФ</div>
      </div>
    </div>
    <div class="mode">Локальная версия · движок правил</div>
  </header>

  <section class="card panel">
    <span class="eyebrow">Рекламный текст для проверки</span>
    <textarea id="input" placeholder="Вставьте рекламный текст, объявление, пост или слоган…"></textarea>
    <div class="actions">
      <div class="channel">
        <label for="channel">Канал:</label>
        <select id="channel">
          <option value="internet">Интернет</option>
          <option value="sms">СМС / рассылка</option>
          <option value="tv">ТВ</option>
          <option value="radio">Радио</option>
          <option value="print">Печать</option>
          <option value="outdoor">Наружная</option>
        </select>
        <button class="linkbtn" id="exampleBtn">Пример</button>
      </div>
      <button class="btn" id="checkBtn">Проверить</button>
    </div>
  </section>

  <div id="report"></div>

  <div class="footer">
    ПравоРеклама · автономная версия (проверка правилами, работает офлайн). Полная версия добавляет ИИ-анализ смысла.
  </div>
</div>

<script>
"use strict";
/* Автономный движок правил. Данные (KB) генерируются из backend/app/knowledge/*.yaml
   сборщиком backend/tools/build_standalone.py — правьте YAML, не этот файл. */
const KB = __KB_DATA__;

const ORDER = { low: 1, medium: 2, high: 3, critical: 4 };
const LEVEL_RU = { low: "Низкий", medium: "Средний", high: "Высокий", critical: "Критический" };
const RISK_EMOJI = { low: "🟢", medium: "🟡", high: "🟠", critical: "🔴" };
const SUFFIXES = ["ыми","ими","ого","его","ому","ему","ая","яя","ое","ее","ые","ий","ый",
  "ых","их","ом","ем","ов","ев","ам","ям","ах","ях","ой","ей","у","ю","а","я","ы","и","е","о","ь"];

function tokens(t){ return (t.toLowerCase().match(/[а-яёa-z0-9]+/g) || []); }
function stem(w){ for(const s of SUFFIXES){ if(w.length-s.length>=3 && w.endsWith(s)) return w.slice(0,w.length-s.length); } return w; }
function lemmaTerm(term){ const t=tokens(term); return t.length ? stem(t[0]) : term.toLowerCase(); }
function snippet(text, idx, len){ const r=42; const a=Math.max(0,idx-r), b=Math.min(text.length,idx+len+r);
  return (a>0?"…":"") + text.slice(a,b).trim() + (b<text.length?"…":""); }

function lawsFor(keys){ return (keys||[]).map(k=>KB.laws[k]).filter(Boolean); }
function liabilityFor(keys){ for(const k of (keys||[])){ if(KB.liability[k]) return KB.liability[k]; } return null; }
function practiceFor(keys){ let r=[]; for(const k of (keys||[])){ if(KB.practice[k]) r=r.concat(KB.practice[k]); } return r; }

function mk(id, cat, title, desc, risk, lawRefs, liabRefs, practiceRefs, fix, evidence, source){
  return { id, category: cat, title, description: desc, risk_level: risk,
    legal_basis: lawsFor(lawRefs), liability: liabilityFor(liabRefs), practice: practiceFor(practiceRefs),
    mitigation: fix || [], evidence: evidence || null, source: source || "Правило" };
}

function detectCategories(text, stemSet){
  const low = text.toLowerCase(); const found = [];
  for(const key in KB.categories){ const c = KB.categories[key]; let hit=false;
    for(const kw of (c.keywords||[])){
      if(kw.includes(" ") || kw.includes("-")){ if(low.includes(kw.toLowerCase())){ hit=true; break; } }
      else { if(stemSet.has(lemmaTerm(kw))){ hit=true; break; } }  // однословные — только целым словом
    }
    // Подстроки для слитных форм («Супервклад», «Мегадепозит»), с исключениями («вкладка»).
    if(!hit && (c.keyword_substrings||[]).length){
      const subs = c.keyword_substrings.map(s=>s.toLowerCase());
      const excl = (c.keyword_substrings_exclude||[]).map(s=>s.toLowerCase());
      for(const tok of (low.match(/[а-яёa-z]+/g) || [])){
        if(excl.some(x=>tok.startsWith(x))) continue;
        if(subs.some(s=>tok.includes(s))){ hit=true; break; }
      }
    }
    if(hit) found.push(key);
  }
  return found;
}

function runGeneralRules(text, stemSet, low, isInternet){
  const out = [];
  for(const id in KB.rules){ const r = KB.rules[id]; let matched=false, ev=null; const type=r.type;
    if(type === "lemma_any"){
      const termLemmas = {};
      for(const t of (r.terms||[])){ const l=lemmaTerm(t); if(l.length>=3 && !/^\d+$/.test(l)) termLemmas[l]=t; }
      const hit = Object.keys(termLemmas).find(l=>stemSet.has(l));
      if(hit){ matched=true; ev=termLemmas[hit]; }
      if(!matched){ for(const p of (r.extra_phrases||[])){ const i=low.indexOf(p.toLowerCase()); if(i>=0){ matched=true; ev=snippet(text,i,p.length); break; } } }
    } else if(type === "phrase_any"){
      for(const p of (r.terms||[])){ const i=low.indexOf(p.toLowerCase()); if(i>=0){ matched=true; ev=snippet(text,i,p.length); break; } }
    } else if(type === "regex_any"){
      for(const p of (r.patterns_regex||[])){ const m=text.match(new RegExp(p,"i")); if(m){ matched=true; ev=snippet(text,m.index,m[0].length); break; } }
    } else if(type === "absent_all"){
      // Маркировка ERID/«реклама» (ст. 18.1) — только для интернет-рекламы.
      if(!isInternet){ continue; }
      const any = (r.patterns_regex||[]).some(p=>new RegExp(p,"i").test(text));
      if(!any){ matched=true; ev=null; }
    } else if(type === "conditional"){
      // Исключение: явный офлайн подавляет триггер, если нет признака дистанционности.
      const excl = r.exclude_patterns||[];
      const excluded = excl.length && excl.some(e=>low.includes(e.toLowerCase())) &&
                       !(r.exclude_unless_patterns||[]).some(u=>low.includes(u.toLowerCase()));
      // Триггер: любая фраза trigger_patterns ЛИБО в каждой группе trigger_groups
      // есть совпадение (ловит «купи … онлайн» с любыми словами между).
      let trig = null;
      if(!excluded){
        trig = (r.trigger_patterns||[]).find(t=>low.includes(t.toLowerCase()));
        if(!trig && (r.trigger_groups||[]).length){
          let ok=true, last=null;
          for(const g of r.trigger_groups){ const h=g.find(p=>low.includes(p.toLowerCase())); if(!h){ ok=false; break; } last=h; }
          if(ok) trig=last;
        }
      }
      if(trig && !(r.required_patterns||[]).some(x=>low.includes(x.toLowerCase()))){ matched=true; const i=low.indexOf(trig.toLowerCase()); ev=snippet(text,i,trig.length); }
    }
    if(matched) out.push(mk(id, id, r.title, r.description, r.risk_level, r.law_refs, r.liability_refs, r.practice_refs, r.mitigation, ev));
  }
  return out;
}

function label(item, fallback){ const l=item.label; if(l) return l; const t=(fallback||"").trim(); return t.length<=70 ? t : t.slice(0,69).trim()+"…"; }

function runCategoryRules(text, cats, low){
  const out = [];
  for(const key of cats){ const c = KB.categories[key]; const title = c.title || key; const proh = c.prohibitions || [];
    // Карточка категории — только если есть неповторяющийся контекст (непустой prohibitions).
    if(proh.length) out.push(mk("category_"+key, key, "Особый правовой режим: "+title,
      "Реклама категории «"+title+"». Обратите внимание на специальные требования законодательства о рекламе:",
      c.risk_level||"medium", c.law_refs, c.liability_refs, c.practice_refs, proh.slice(), null));
    for(const d of (c.required_disclaimers||[])){
      const present = (d.patterns||[]).some(p=>low.includes(p.toLowerCase()));
      if(!present) out.push(mk("disclaimer_"+key+"_"+d.id, key, "Не указано обязательное: "+label(d,d.text),
        "Категория «"+title+"». Не обнаружено обязательное: "+d.text+".", d.risk_level||c.risk_level||"medium",
        d.law_refs||c.law_refs, c.liability_refs, c.practice_refs, ["Добавьте: "+d.text], null));
    }
    for(const d of (c.conditional_disclaimers||[])){
      const trig = (d.trigger_patterns||[]).find(t=>low.includes(t.toLowerCase()));
      const sat = (d.required_patterns||[]).some(x=>low.includes(x.toLowerCase()));
      if(trig && !sat){ const i=low.indexOf(trig.toLowerCase());
        out.push(mk("cond_"+key+"_"+d.id, key, "Не раскрыто обязательное: "+label(d,d.text),
          "Категория «"+title+"». В рекламе указано условие «"+trig+"», но отсутствует обязательное раскрытие: "+d.text+".",
          d.risk_level||c.risk_level||"medium", d.law_refs||c.law_refs, c.liability_refs, c.practice_refs, ["Добавьте: "+d.text], snippet(text,i,trig.length))); }
    }
    for(const fp of (c.forbidden_patterns||[])){
      const hit = (fp.patterns||[]).find(p=>low.includes(p.toLowerCase()));
      if(hit){ const i=low.indexOf(hit.toLowerCase());
        out.push(mk("forbidden_"+key+"_"+fp.id, key, "Запрещённая формулировка: "+label(fp,fp.text),
          "Категория «"+title+"». "+(fp.text || "Обнаружена запрещённая формулировка."), fp.risk_level || c.risk_level || "high",
          fp.law_refs||c.law_refs, c.liability_refs, c.practice_refs, ["Удалите или переформулируйте: "+(fp.text||"")], snippet(text,i,hit.length))); }
    }
  }
  return out;
}

function analyze(text, channel){
  channel = channel || "internet";
  const isInternet = channel === "internet";
  const low = text.toLowerCase(); const stemSet = new Set(tokens(text).map(stem));
  const cats = detectCategories(text, stemSet);
  let f = runGeneralRules(text, stemSet, low, isInternet).concat(runCategoryRules(text, cats, low));
  const seen = new Set(); const uniq = [];
  for(const x of f){ const k=x.title.toLowerCase()+"|"+((x.evidence||"").toLowerCase()); if(seen.has(k)) continue; seen.add(k); uniq.push(x); }
  uniq.sort((a,b)=>ORDER[b.risk_level]-ORDER[a.risk_level] || (a.source==="Правило"?-1:1));
  const overall = uniq.length ? uniq.reduce((m,x)=>ORDER[x.risk_level]>ORDER[m]?x.risk_level:m, "low") : "low";
  return { overall, findings: uniq, cats, channel, isInternet };
}

/* ---------- Рендер ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function lawHtml(list){ return list.map(lb=>'<p><span class="law-ref">'+esc(lb.law)+", "+esc(lb.article)+'</span></p>'+
  (lb.summary?'<p class="law-sum">'+esc(lb.summary)+'</p>':"")+
  (lb.url?'<a class="link" href="'+lb.url+'" target="_blank" rel="noreferrer">источник ↗</a>':"")).join(""); }
function finesHtml(l){ if(!l) return ""; let r='<p><span class="law-ref">'+esc(l.koap_article)+'</span></p><ul class="fines">';
  if(l.fine_citizens) r+='<li>Граждане <span class="amt">'+esc(l.fine_citizens)+'</span></li>';
  if(l.fine_officials) r+='<li>Должностные <span class="amt">'+esc(l.fine_officials)+'</span></li>';
  if(l.fine_legal) r+='<li>Юрлица <span class="amt">'+esc(l.fine_legal)+'</span></li>';
  r+='</ul>'; if(l.note) r+='<p class="law-sum">'+esc(l.note)+'</p>'; return r; }
function practiceHtml(list){ return list.map(p=>'<p><b>'+esc(p.type)+':</b> '+esc(p.reference||"")+
  '<span class="law-sum" style="display:block">'+esc(p.summary||"")+'</span></p>').join(""); }

function render(res){
  const rep = document.getElementById("report");
  const counts = { critical:0, high:0, medium:0, low:0 }; res.findings.forEach(f=>counts[f.risk_level]++);
  const n = res.findings.length;
  const dots = lvl => { const on=ORDER[lvl]; return [3,2,1].map(v=>'<span class="light__dot'+(on===v?" light__dot--on":"")+'"></span>').join(""); };
  const sub = n===0 ? "Явных правовых рисков движок не обнаружил. Рекомендуется финальная проверка юристом."
    : "Выявлено рисков: "+n+" ("+RISK_EMOJI.critical+counts.critical+" "+RISK_EMOJI.high+counts.high+" "+RISK_EMOJI.medium+counts.medium+" "+RISK_EMOJI.low+counts.low+"). Проверьте каждый пункт ниже.";

  let html = '<button class="ghost" id="exportBtn" style="margin-bottom:12px">🖨 Скачать PDF / печать</button>';
  html += '<div class="hero hero--'+res.overall+'"><div class="light light--'+res.overall+'">'+dots(res.overall)+'</div>'+
    '<div><div class="hero__label">Итоговый уровень риска</div><div class="hero__level hero__level--'+res.overall+'">'+LEVEL_RU[res.overall]+'</div><div class="hero__sub">'+esc(sub)+'</div></div></div>';
  html += '<div class="counts">'+["critical","high","medium","low"].map(k=>'<span class="count"><span class="swatch" style="background:var(--'+k+')"></span>'+LEVEL_RU[k]+': <b>'+counts[k]+'</b></span>').join("")+'</div>';
  if(res.cats.length) html += '<div class="chips"><span class="eyebrow">Категории:</span>'+res.cats.map(c=>'<span class="chip">'+esc(KB.categories[c].title)+'</span>').join("")+'</div>';
  if(!res.isInternet){ const CH={sms:"СМС / рассылка",tv:"ТВ",radio:"Радио",print:"Печать",outdoor:"Наружная",email:"E-mail"};
    html += '<div class="chan-note">Канал: <b>'+esc(CH[res.channel]||res.channel)+'</b>. Риски маркировки интернет-рекламы (ERID, пометка «реклама») не показаны — ст. 18.1 применяется только к рекламе в сети «Интернет». Для СМС/рассылок действует ст. 18 (предварительное согласие абонента).</div>'; }

  if(n===0){ html += '<div class="empty">✅ Явных нарушений не найдено. Это не заменяет проверку юристом.</div>'; }
  else {
    html += '<div class="section-label">Найденные риски — по убыванию серьёзности</div><div class="findings">';
    res.findings.forEach((f,i)=>{
      html += '<article class="finding finding--'+f.risk_level+'"><div class="f-head"><span class="f-num">'+(i+1)+'</span>'+
        '<h3 class="f-title">'+esc(f.title)+'</h3><div class="f-tags"><span class="badge badge--'+f.risk_level+'">'+LEVEL_RU[f.risk_level]+'</span><span class="src">'+esc(f.source)+'</span></div></div>';
      html += '<p class="f-desc">'+esc(f.description)+'</p>';
      if(f.evidence) html += '<div class="evidence"><span class="eyebrow">Фрагмент рекламы</span>«'+esc(f.evidence)+'»</div>';
      html += '<div class="grid">';
      if(f.legal_basis.length) html += '<div class="block"><h4>📖 Правовое основание</h4>'+lawHtml(f.legal_basis)+'</div>';
      if(f.liability) html += '<div class="block"><h4>⚖️ Ответственность</h4>'+finesHtml(f.liability)+'</div>';
      if(f.mitigation.length) html += '<div class="block"><h4>🛠 Меры минимизации</h4><ul>'+f.mitigation.map(m=>'<li>'+esc(m)+'</li>').join("")+'</ul></div>';
      if(f.practice.length) html += '<div class="block"><h4>🏛 Практика ФАС / судов</h4>'+practiceHtml(f.practice)+'</div>';
      html += '</div></article>';
    });
    html += '</div>';
  }
  html += '<div class="disclaimer">⚠️ '+esc(KB.disclaimer)+'</div>';
  rep.innerHTML = html;
  const eb = document.getElementById("exportBtn"); if(eb) eb.onclick = ()=>window.print();
  rep.scrollIntoView({ behavior:"smooth", block:"start" });
}

/* ---------- События ---------- */
const EXAMPLE = "Наш банк — №1 в России! Кредит наличными от 5% годовых без справок. Вклад с гарантированной ставкой 12% годовых. Оставьте заявку — перезвоним за 5 минут!";
document.getElementById("checkBtn").onclick = ()=>{ const t=document.getElementById("input").value.trim(); if(!t) return; const ch=document.getElementById("channel").value; render(analyze(t, ch)); };
document.getElementById("exampleBtn").onclick = ()=>{ document.getElementById("input").value = EXAMPLE; };
document.getElementById("input").addEventListener("keydown", e=>{ if((e.ctrlKey||e.metaKey) && e.key==="Enter") document.getElementById("checkBtn").click(); });

</script>
</body>
</html>
