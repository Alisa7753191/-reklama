# Реестр правовых оснований (законы и статьи).
# Каждая запись адресуется по ключу из правил (rules.yaml) и категорий (categories.yaml).
# ВНИМАНИЕ: сведения носят справочный характер и должны быть выверены юристом
# перед использованием в реальной работе. Актуальность — на момент создания MVP.

fz38_st5_p2:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 5, ч. 2"
  title: "Недобросовестная реклама"
  summary: >-
    Недобросовестной признаётся реклама, которая содержит некорректные сравнения
    с товарами конкурентов, порочит честь и достоинство, представляет собой акт
    недобросовестной конкуренции либо рекламирует товар под видом другого.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz38_st5_p3:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 5, ч. 3"
  title: "Недостоверная реклама"
  summary: >-
    Недостоверной признаётся реклама, содержащая не соответствующие
    действительности сведения — в т.ч. о преимуществах перед конкурентами,
    о характеристиках, стоимости, гарантиях, результатах исследований.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz38_st5_p3_1:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 5, ч. 3, п. 1"
  title: "Недостоверные сведения о преимуществах (превосходная степень)"
  summary: >-
    Не соответствующие действительности сведения о преимуществах товара перед
    находящимися в обороте товарами других изготовителей. Использование слов
    «лучший», «первый», «номер один», «самый», «единственный» и т.п. без
    документального подтверждения объективными критериями трактуется ФАС как
    недостоверная реклама.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz38_st5_p7:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 5, ч. 7"
  title: "Отсутствие существенной информации"
  summary: >-
    Не допускается реклама, в которой отсутствует часть существенной информации
    о рекламируемом товаре, об условиях его приобретения или использования, если
    при этом искажается смысл информации и вводятся в заблуждение потребители.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz38_st5_p11:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 5, ч. 11"
  title: "Использование иностранных слов без перевода"
  summary: >-
    В рекламе не допускается использование иностранных слов и выражений, которые
    могут привести к искажению смысла информации.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz38_st6:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 6"
  title: "Защита несовершеннолетних в рекламе"
  summary: >-
    В рекламе не допускается дискредитация родителей и воспитателей, побуждение
    несовершеннолетних убедить родителей приобрести товар, создание искажённого
    представления о доступности товара для семьи с любым уровнем достатка,
    формирование комплекса неполноценности у детей и т.п.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz38_st7:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 7"
  title: "Объекты рекламирования, реклама которых не допускается"
  summary: >-
    Запрещена реклама товаров, производство/оборот которых запрещены; наркотических
    средств; взрывчатых веществ; органов и тканей человека; товаров без обязательной
    сертификации/лицензии; никотинсодержащей продукции, кальянов, устройств для
    потребления никотина и др.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz38_st21:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 21"
  title: "Реклама алкогольной продукции"
  summary: >-
    Реклама алкоголя не должна обращаться к несовершеннолетним, использовать их
    образы, образы людей и животных; утверждать о пользе алкоголя; размещаться в
    детских, образовательных, медицинских, спортивных учреждениях и ближе 100 м от
    них, на транспорте, наружной рекламе. Должна сопровождаться предупреждением о
    вреде (не менее 10% площади). Реклама алкоголя в сети «Интернет» запрещена.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz38_tobacco:
  law: "ФЗ «О рекламе» № 38-ФЗ; ФЗ № 15-ФЗ"
  article: "ст. 7 ФЗ-38; ст. 16 ФЗ-15 (ст. 23 ФЗ-38 утратила силу)"
  title: "Запрет рекламы табачной и никотинсодержащей продукции"
  summary: >-
    Статья 23 ФЗ-38 утратила силу (274-ФЗ от 21.10.2013). Реклама табака, табачной,
    никотинсодержащей продукции, устройств для их потребления, кальянов, вейпов и
    процесса потребления запрещена: ст. 7 ФЗ-38 и ст. 16 ФЗ-15 «Об охране здоровья
    граждан от воздействия окружающего табачного дыма…».
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz38_st24:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 24"
  title: "Реклама лекарств, медицинских изделий и услуг"
  summary: >-
    Реклама лекарственных препаратов, медицинских изделий и услуг, методов лечения
    должна сопровождаться предупреждением о наличии противопоказаний, необходимости
    ознакомиться с инструкцией или получить консультацию специалиста (в радио- и
    видеорекламе — не менее 3 секунд, в иной — не менее 5% рекламной площади).
    Не допускается реклама рецептурных препаратов вне специализированных изданий,
    гарантии эффективности, ссылки на конкретные случаи излечения.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz38_st25:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 25"
  title: "Реклама биологически активных добавок (БАД)"
  summary: >-
    Реклама БАД не должна создавать впечатление, что они являются лекарственными
    средствами, обладают лечебными свойствами, содержать ссылки на конкретные случаи
    излечения. Должна сопровождаться предупреждением о том, что объект рекламирования
    не является лекарственным средством (не менее 10% площади/времени).
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz38_st27:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 27"
  title: "Реклама основанных на риске игр и пари"
  summary: >-
    Реклама азартных игр и пари (казино, букмекерских контор) допускается с
    ограничениями: не обращаться к несовершеннолетним, не создавать впечатление
    гарантированного выигрыша/источника дохода, сопровождаться предупреждением о
    рисках, размещаться в строго ограниченных местах и время.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz38_st28_1:
  law: "ФЗ «О рекламе» № 38-ФЗ (наименование — ГК РФ ст. 54, 1473)"
  article: "ст. 28, ч. 1"
  title: "Реклама финансовых услуг — фирменное наименование лица"
  summary: >-
    Реклама банковских, страховых и иных финансовых услуг должна содержать
    наименование или имя лица, оказывающего услуги. Для юридического лица
    «наименование» — это его ФИРМЕННОЕ наименование (организационно-правовая форма +
    название, напр. «ПАО Сбербанк»), а не бренд, логотип или коммерческое обозначение
    (напр. «Сбер»). Для ИП — фамилия, имя, отчество. Реклама только под брендом без
    фирменного наименования нарушает ст. 28 ч. 1 (практика ФАС).
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/0021818db8b93ae5fbd38076074a7182e157186c/"

fz38_st28_2_1:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 28, ч. 2, п. 1"
  title: "Запрет гарантий доходности вложений"
  summary: >-
    Реклама финансовых услуг не должна содержать гарантии или обещания в будущем
    эффективности деятельности (доходности вложений), в т.ч. основанные на реальных
    показателях в прошлом, если такая доходность не может быть определена на момент
    заключения договора. Актуально для инвестиций, ценных бумаг, форекс, ДУ.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/0021818db8b93ae5fbd38076074a7182e157186c/"

fz38_st28_2_2:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 28, ч. 2, п. 2"
  title: "Запрет умолчания об условиях (триггерное правило)"
  summary: >-
    Реклама финансовых услуг не должна умалчивать об иных условиях оказания услуг,
    влияющих на сумму доходов или расходов потребителя, если в рекламе сообщается
    хотя бы одно из таких условий. Для вкладов: указал ставку — раскрой срок, сумму,
    капитализацию, условия пополнения/снятия.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/0021818db8b93ae5fbd38076074a7182e157186c/"

fz38_st28_credit:
  law: "ФЗ «О рекламе» № 38-ФЗ (ред. 479-ФЗ от 26.12.2024)"
  article: "ст. 28, ч. 2.1–3.2 (реклама потребительского кредита/займа)"
  title: "Реклама кредитов и займов — специальные требования"
  summary: >-
    С 01.03.2025 к рекламе потребительского кредита (займа) применяется комплекс
    требований ч. 2.1, 3, 3.1 ст. 28; в силу ч. 3.2 те же правила действуют для
    кредитов физлицам, обеспеченных ипотекой.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/0021818db8b93ae5fbd38076074a7182e157186c/"

fz38_st28_2_1_terms:
  law: "ФЗ «О рекламе» № 38-ФЗ (введена 479-ФЗ от 26.12.2024)"
  article: "ст. 28, ч. 2.1"
  title: "«Изучите все условия кредита (займа)» либо все условия в рекламе"
  summary: >-
    Если реклама кредита (займа) содержит хотя бы одно условие, влияющее на полную
    стоимость кредита (по 353-ФЗ), она должна либо содержать предупреждение «Изучите
    все условия кредита (займа)» с указанием на раздел официального сайта кредитора с
    подробными условиями, либо содержать все такие условия непосредственно в рекламе
    (радио ≥3 сек; ТВ/видео ≥3 сек и ≥5% кадра; иное ≥5% площади).
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/0021818db8b93ae5fbd38076074a7182e157186c/"

fz38_st28_3_psk:
  law: "ФЗ «О рекламе» № 38-ФЗ (ред. 479-ФЗ от 26.12.2024)"
  article: "ст. 28, ч. 3"
  title: "Диапазоны ПСК при указании процентных ставок"
  summary: >-
    Если реклама кредита (займа) содержит информацию о процентных ставках, она должна
    (в дополнение к ч. 2.1) содержать диапазоны значений полной стоимости кредита по
    видам кредита С ИСПОЛЬЗОВАНИЕМ СЛОВ «полная стоимость кредита (займа)» — одной
    аббревиатуры «ПСК» недостаточно. Эта информация размещается ДО информации о
    ставках и шрифтом не меньше шрифта ставок.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/0021818db8b93ae5fbd38076074a7182e157186c/"

fz38_st28_3_1_warning:
  law: "ФЗ «О рекламе» № 38-ФЗ (введена 479-ФЗ от 26.12.2024)"
  article: "ст. 28, ч. 3.1"
  title: "Предупреждение «Оценивайте свои финансовые возможности и риски»"
  summary: >-
    Реклама услуг, связанных с предоставлением потребительского кредита (займа),
    пользованием им и его погашением, должна содержать предупреждение «Оценивайте
    свои финансовые возможности и риски» (радио ≥3 сек; ТВ/видео ≥3 сек и ≥5% площади
    кадра; иные способы ≥5% рекламной площади).
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/0021818db8b93ae5fbd38076074a7182e157186c/"

fz38_st28_3_2_mortgage:
  law: "ФЗ «О рекламе» № 38-ФЗ (введена 479-ФЗ от 26.12.2024)"
  article: "ст. 28, ч. 3.2"
  title: "Распространение требований на ипотечные кредиты физлицам"
  summary: >-
    Правила ч. 2.1, 3 и 3.1 ст. 28 применяются также к рекламе кредитов (займов)
    физическим лицам не для предпринимательской деятельности, обязательства по которым
    обеспечены ипотекой.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/0021818db8b93ae5fbd38076074a7182e157186c/"

fz38_st28_bankruptcy:
  law: "ФЗ «О рекламе» № 38-ФЗ (ст. 28.1, введена 332-ФЗ от 31.07.2025)"
  article: "ст. 28.1"
  title: "Реклама услуг, связанных с процедурой банкротства"
  summary: >-
    С 01.01.2026 реклама услуг по банкротству граждан (снижение/прекращение
    задолженности) НЕ должна содержать: гарантии/обещания освобождения от денежных
    обязательств; призыв не исполнять обязательства; утверждение о создании
    государством системы освобождения от долгов; упоминание о возможности освобождения
    от обязательств. Должна содержать указание: «Банкротство влечёт негативные
    последствия, в том числе ограничения на получение кредита и повторное банкротство
    в течение пяти лет. Предварительно обратитесь к своему кредитору и в МФЦ.» (радио
    ≥3 сек; ТВ/видео ≥3 сек и ≥7% кадра; иное ≥7% площади).
  url: "https://www.consultant.ru/legalnews/29175/"

fz38_st29:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 29"
  title: "Реклама ценных бумаг"
  summary: >-
    Реклама ценных бумаг должна содержать сведения о лицах, обязавшихся по ценным
    бумагам; запрещено обещание выплаты дивидендов/дохода, если размер не определён,
    и прогнозы роста курсовой стоимости.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz38_st18_1:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 18.1"
  title: "Маркировка интернет-рекламы (ERID)"
  summary: >-
    Реклама в сети «Интернет», направленная на потребителей на территории РФ, должна
    содержать пометку «реклама», указание на рекламодателя (или сайт с информацией о
    нём) и уникальный идентификатор рекламы (erid), присвоенный оператором рекламных
    данных (ОРД). Сведения о рекламе передаются в Единый реестр интернет-рекламы (ЕРИР)
    через ОРД.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz436_age:
  law: "ФЗ № 436-ФЗ «О защите детей от информации…»"
  article: "ст. 6, ст. 11"
  title: "Возрастная маркировка информационной продукции"
  summary: >-
    Информационная продукция, в т.ч. распространяемая с рекламой, подлежит возрастной
    классификации со знаком информационной продукции (0+, 6+, 12+, 16+, 18+) в
    установленных законом случаях.
  url: "https://www.consultant.ru/document/cons_doc_LAW_108808/"

fz152_pdn:
  law: "ФЗ № 152-ФЗ «О персональных данных»"
  article: "ст. 6, ст. 9"
  title: "Обработка персональных данных"
  summary: >-
    Сбор персональных данных (имя, телефон, e-mail через формы) требует правового
    основания, как правило — согласия субъекта. Необходимы политика обработки ПДн и
    получение согласия до сбора данных.
  url: "https://www.consultant.ru/document/cons_doc_LAW_61801/"

zpp_info:
  law: "Закон РФ № 2300-1 «О защите прав потребителей»"
  article: "ст. 8–10"
  title: "Право потребителя на достоверную информацию"
  summary: >-
    Потребителю должна предоставляться необходимая и достоверная информация о
    товарах (работах, услугах), обеспечивающая возможность их правильного выбора.
  url: "https://www.consultant.ru/document/cons_doc_LAW_305/"

fz38_st8:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 8"
  title: "Реклама товаров при дистанционной продаже"
  summary: >-
    В рекламе товаров при дистанционном способе продажи должны быть указаны сведения
    о продавце: для юрлица — наименование, место нахождения и ОГРН; для ИП — ФИО и
    ОГРНИП; для самозанятого — ФИО и ИНН.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz38_st9:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 9"
  title: "Реклама о проведении стимулирующих мероприятий"
  summary: >-
    В рекламе конкурса, игры, розыгрыша, условием участия в которых является покупка
    товара, должны быть указаны: сроки проведения; источник информации об организаторе,
    правилах, количестве призов/выигрышей, сроках, месте и порядке их получения.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz38_st16:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 16"
  title: "Реклама в периодических печатных изданиях"
  summary: >-
    Размещение текста рекламы в изданиях, не специализирующихся на рекламе, должно
    сопровождаться пометкой «реклама» или «на правах рекламы».
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz38_st18:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 18"
  title: "Реклама по сетям электросвязи (СМС, звонки, email)"
  summary: >-
    Распространение рекламы по сетям электросвязи (в т.ч. SMS, автодозвон, email)
    допускается только при предварительном согласии абонента/адресата. Реклама должна
    немедленно прекращаться по требованию лица, которому она адресована.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz38_st25_1:
  law: "ФЗ «О рекламе» № 38-ФЗ (ст. 25.1, введена 393-ФЗ от 27.10.2025)"
  article: "ст. 25.1"
  title: "Реклама безалкогольных тонизирующих (энергетических) напитков"
  summary: >-
    Реклама энергетических напитков не должна обращаться к несовершеннолетним и
    содержать информацию о наличии в них БАД и витаминов. В каждом случае должна
    сопровождаться предупреждением о вреде чрезмерного потребления (радио ≥3 сек;
    ТВ/видео ≥5 сек и ≥7% кадра; иное ≥7% площади).
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz38_st26:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 26"
  title: "Реклама продукции военного назначения и оружия"
  summary: >-
    Не допускается реклама продукции военного назначения (кроме ВТС) и оружия, не
    указанного в ч. 3–5 ст. 26. Реклама служебного, боевого, гражданского оружия
    допускается только в специализированных изданиях, местах производства/реализации
    и стрельбищах, с соблюдением ограничений.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz38_st28_forex:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 28, ч. 5.1"
  title: "Реклама сделок с форекс-дилерами"
  summary: >-
    Реклама, побуждающая к заключению сделок с форекс-дилерами, должна содержать
    указание: «Предлагаемые к заключению договоры или финансовые инструменты являются
    высокорискованными и могут привести к потере внесенных денежных средств в полном
    объеме. До совершения сделок следует ознакомиться с рисками, с которыми они связаны.».
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/0021818db8b93ae5fbd38076074a7182e157186c/"

fz38_st29_1:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 29.1"
  title: "Реклама цифровых финансовых активов (ЦФА)"
  summary: >-
    Реклама выпускаемых ЦФА должна содержать: наименование лица, выпускающего ЦФА;
    адрес сайта с решением о выпуске; сведения о максимальной сумме для неквалифи-
    цированных инвесторов; указание на то, что ЦФА являются высокорискованными и их
    приобретение может привести к потере средств в полном объеме.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"

fz38_st30:
  law: "ФЗ «О рекламе» № 38-ФЗ"
  article: "ст. 30"
  title: "Реклама услуг по договорам ренты и пожизненного содержания"
  summary: >-
    Реклама услуг по договорам ренты (пожизненного содержания с иждивением) не должна
    содержать: благодарности заключивших договоры; утверждения о преимуществах перед
    завещанием; осуждения родственников потребителя; упоминания о подарках. Посредник
    обязан указать, что плательщиком ренты будет другое лицо.
  url: "https://www.consultant.ru/document/cons_doc_LAW_58968/"
