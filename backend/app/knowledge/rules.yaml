# Общие (категория-независимые) правила детерминированного движка.
# type:
#   lemma_any   — сработать, если среди лемм текста есть любая из terms
#   phrase_any  — сработать по вхождению любой из подстрок (без морфологии)
#   regex_any   — сработать по любому из регулярных выражений
#   absent_all  — сработать, если НИ одна из patterns не найдена (проверка отсутствия)
# absent_all-правила запускаются условно (см. engine): только когда контент — интернет-реклама.

superlative:
  title: "Превосходная степень без подтверждения"
  type: "lemma_any"
  # terms — только словесные формы (обрабатываются морфологией).
  terms: ["лучший", "первый", "самый", "единственный", "лидер",
          "непревзойдённый", "непревзойденный", "эталон", "топовый"]
  # extra_phrases — символьные/числовые формы (проверяются как подстроки).
  extra_phrases: ["№1", "№ 1", "#1", "no.1", "номер 1", "номер один",
                  "самый лучший", "вне конкуренции"]
  risk_level: "high"
  law_refs: ["fz38_st5_p3_1"]
  liability_refs: ["koap_14_3_1"]
  practice_refs: ["superlative"]
  description: >-
    Обнаружены слова превосходной степени. Без документального подтверждения
    объективными критериями это трактуется ФАС как недостоверная реклама.
  mitigation:
    - "Удалите слова превосходной степени или добавьте объективный критерий сравнения"
    - "Сошлитесь на подтверждающий источник (исследование, рейтинг с методологией)"
    - "Уточните: «по версии …», «по данным … за … год»"

guarantee:
  title: "Гарантии результата / безусловные обещания"
  type: "phrase_any"
  # Без бытового «гарантированно»: финансовые гарантии обрабатываются категориями
  # (инвестиции — запрет ст. 28 ч. 2 п. 1; вклад — фиксированная ставка допустима).
  terms: ["гарантия результата", "гарантируем результат", "100% результат", "стопроцентно",
          "абсолютно безопасно", "без побочных", "без противопоказаний", "навсегда избавит",
          "мгновенный результат", "вылечит", "излечивает", "пожизненная гарантия"]
  risk_level: "high"
  law_refs: ["fz38_st5_p3"]
  liability_refs: ["koap_14_3_1"]
  practice_refs: []
  description: >-
    Безусловные обещания результата и гарантии эффективности могут быть признаны
    недостоверной рекламой, особенно для медицинских и финансовых продуктов.
  mitigation:
    - "Замените безусловные обещания на корректные формулировки"
    - "Избегайте гарантий эффективности лечения и гарантий дохода"

comparison:
  title: "Некорректное сравнение с конкурентами"
  type: "phrase_any"
  terms: ["лучше чем у конкурентов", "лучше конкурентов", "дешевле всех", "выгоднее всех",
          "лучше, чем", "в отличие от других", "никто не предлагает", "только у нас"]
  risk_level: "medium"
  law_refs: ["fz38_st5_p2"]
  liability_refs: ["koap_14_3_1"]
  practice_refs: ["comparison"]
  description: >-
    Сравнение с конкурентами без конкретных измеримых параметров и подтверждения
    может быть признано некорректным сравнением и недобросовестной рекламой.
  mitigation:
    - "Приведите конкретные измеримые параметры сравнения и их подтверждение"
    - "Избегайте общих оценочных сравнений без критериев"

free_bait:
  title: "«Бесплатно» / «акция» при наличии условий"
  type: "phrase_any"
  terms: ["бесплатно", "0 рублей", "0 ₽", "даром", "в подарок", "бесплатный"]
  risk_level: "low"
  law_refs: ["fz38_st5_p7"]
  liability_refs: ["koap_14_3_1"]
  practice_refs: []
  description: >-
    Слова «бесплатно»/«акция» требуют раскрытия существенных условий. Их отсутствие
    может ввести потребителя в заблуждение (ст. 5 ч. 7).
  mitigation:
    - "Раскройте все существенные условия акции (сроки, ограничения, что входит)"
    - "Избегайте «бесплатно», если получение блага обусловлено покупкой"

personal_data:
  title: "Сбор персональных данных"
  type: "phrase_any"
  terms: ["оставьте телефон", "оставьте заявку", "введите номер", "укажите e-mail",
          "укажите email", "оставьте контакты", "заполните форму", "оставьте свой номер",
          "получите на почту", "подпишитесь", "оставить заявку"]
  risk_level: "medium"
  law_refs: ["fz152_pdn"]
  liability_refs: ["koap_13_11_pdn"]
  practice_refs: []
  description: >-
    Реклама предполагает сбор персональных данных. Необходимо согласие субъекта на
    обработку ПДн и наличие политики обработки персональных данных.
  mitigation:
    - "Добавьте чекбокс согласия на обработку ПДн со ссылкой на политику"
    - "Разместите политику обработки персональных данных"

erid_missing:
  title: "Отсутствует идентификатор рекламы (erid)"
  type: "absent_all"
  patterns_regex: ["erid", "ерид", "kt[a-z0-9]{6,}"]
  risk_level: "high"
  law_refs: ["fz38_st18_1"]
  liability_refs: ["koap_14_3_16"]
  practice_refs: ["erid_missing"]
  description: >-
    Для интернет-рекламы обязателен уникальный идентификатор erid, присвоенный ОРД.
    В проверяемом контенте он не обнаружен.
  mitigation:
    - "Получите erid у оператора рекламных данных (ОРД) до запуска"
    - "Разместите erid в креативе/тексте и обеспечьте передачу сведений в ЕРИР"

reklama_label_missing:
  title: "Отсутствует пометка «реклама» и рекламодатель"
  type: "absent_all"
  patterns_regex: ["реклама", "рекламодатель"]
  risk_level: "medium"
  law_refs: ["fz38_st18_1"]
  liability_refs: ["koap_14_3_16"]
  practice_refs: ["erid_missing"]
  description: >-
    Интернет-реклама должна содержать пометку «реклама» и указание на рекламодателя
    (или ссылку на сайт с информацией о нём).
  mitigation:
    - "Добавьте пометку «Реклама» и данные рекламодателя (ИНН/наименование)"

age_marking_missing:
  title: "Отсутствует возрастная маркировка информационной продукции"
  # Возрастной знак (0+…18+) обязателен в рекламе ТОЛЬКО если объект рекламы —
  # информационная продукция (436-ФЗ): фильмы, книги, СМИ/сетевые издания, игры,
  # приложения, зрелищные мероприятия. Для обычных товаров/услуг НЕ требуется.
  type: "conditional"
  trigger_patterns: ["фильм", "кино", "сериал", "мультфильм", "премьер", "спектакль",
                     "театр", "концерт", "выставка", "фестиваль", "книга", "журнал",
                     "газета", "печатное издание", "сетевое издание", "телеканал",
                     "телепередача", "радиостанция", "подкаст", "видеоигр",
                     "компьютерная игра", "мобильная игра",
                     # программы для ЭВМ / мобильные приложения — тоже инфопродукция:
                     "приложени", "мобильный банк", "онлайн-банк", "онлайн банк",
                     "google play", "app store", "appstore", "play маркет", "play market",
                     "rustore", "app gallery", "appgallery"]
  required_patterns: ["0+", "6+", "12+", "16+", "18+"]
  risk_level: "low"
  law_refs: ["fz436_age"]
  liability_refs: ["koap_14_3_1"]
  practice_refs: ["age_marking"]
  description: >-
    Рекламируется информационная продукция (436-ФЗ), в т.ч. программа для ЭВМ /
    мобильное приложение, но не обнаружен знак возрастной категории (0+…18+). По практике
    ФАС возрастной знак в рекламе обязателен именно для информационной продукции (СМИ,
    фильмы, книги, игры, мобильные приложения, зрелищные мероприятия), а не
    для рекламы обычных товаров и услуг.
  mitigation:
    - "Добавьте знак возрастной категории (0+…18+), соответствующий классификации продукции"

distance_selling:
  title: "Дистанционная продажа без реквизитов продавца"
  type: "conditional"
  # Прямые признаки интернет-магазина (срабатывают сами по себе):
  trigger_patterns: ["интернет-магазин", "интернет магазин", "маркетплейс"]
  # ИЛИ со-встречаемость: слово покупки + онлайн-признак (в любом порядке, с любыми
  # словами между) — ловит «купи товары онлайн», «закажи с доставкой» и т. п.
  trigger_groups:
    - ["купи", "купить", "куплю", "заказ", "закаж", "приобрет", "в корзину", "корзину", "оформи заказ"]
    - ["онлайн", "на сайте", "в интернете", "через сайт", "в приложении",
       "через приложение", "с доставкой", "доставк", "по почте", "маркетплейс"]
  required_patterns: ["огрн", "инн", "ип "]
  risk_level: "medium"
  law_refs: ["fz38_st8"]
  liability_refs: ["koap_14_3_1"]
  practice_refs: []
  description: >-
    Реклама товаров при дистанционном способе продажи должна содержать сведения о
    продавце (наименование и ОГРН для юрлица; ФИО и ОГРНИП для ИП; ФИО и ИНН для
    самозанятого). В рекламе они не обнаружены.
  mitigation:
    - "Добавьте наименование и ОГРН (для юрлица) либо ФИО и ОГРНИП/ИНН продавца"

promo_event:
  title: "Стимулирующее мероприятие без обязательных сведений"
  type: "conditional"
  trigger_patterns: ["розыгрыш", "разыгрыва", "конкурс", "выиграй", "главный приз",
                     "ценные призы", "гарантированный приз", "участвуй и выиграй"]
  required_patterns: ["срок", "организатор", "правил"]
  risk_level: "medium"
  law_refs: ["fz38_st9"]
  liability_refs: ["koap_14_3_1"]
  practice_refs: []
  description: >-
    Реклама конкурса, игры, розыгрыша (стимулирующего мероприятия) должна указывать
    сроки проведения и источник информации об организаторе, правилах, количестве
    призов, сроках и порядке их получения. Эти сведения не обнаружены.
  mitigation:
    - "Укажите сроки акции и источник правил (сайт), организатора и порядок получения призов"

telecom_ads:
  title: "Реклама по сетям электросвязи — требуется согласие"
  type: "conditional"
  trigger_patterns: ["смс-рассылка", "sms-рассылка", "рассылка по базе", "автообзвон",
                     "email-рассылка", "рассылка на телефон", "разошлём", "разошлем"]
  required_patterns: ["согласие", "отписаться", "отказаться от рассылки"]
  risk_level: "medium"
  law_refs: ["fz38_st18"]
  liability_refs: ["koap_14_3_1"]
  practice_refs: []
  description: >-
    Реклама по сетям электросвязи (SMS, автодозвон, email) допускается только при
    предварительном согласии абонента и должна прекращаться по его требованию.
  mitigation:
    - "Убедитесь в наличии предварительного согласия адресата на рекламу"
    - "Обеспечьте простой способ отказа от рассылки"
