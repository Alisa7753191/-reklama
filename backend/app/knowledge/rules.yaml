# Общие (категория-независимые) правила детерминированного движка.
# type:
#   lemma_any   — сработать, если среди лемм текста есть любая из terms
#   phrase_any  — сработать по вхождению любой из подстрок (без морфологии)
#   regex_any   — сработать по любому из регулярных выражений
#   absent_all  — сработать, если НИ одна из patterns не найдена (проверка отсутствия)
# absent_all-правила запускаются условно (см. engine): только когда контент — интернет-реклама.

superlative:
  title: "Превосходная степень без подтверждения"
  type: "lemma_any"
  # terms — только словесные формы (обрабатываются морфологией).
  terms: ["лучший", "первый", "самый", "единственный", "лидер",
          "непревзойдённый", "непревзойденный", "эталон", "топовый"]
  # extra_phrases — символьные/числовые формы (проверяются как подстроки).
  extra_phrases: ["№1", "№ 1", "#1", "no.1", "номер 1", "номер один",
                  "самый лучший", "вне конкуренции"]
  risk_level: "high"
  law_refs: ["fz38_st5_p3_1"]
  liability_refs: ["koap_14_3_1"]
  practice_refs: ["superlative"]
  description: >-
    Обнаружены слова превосходной степени. Без документального подтверждения
    объективными критериями это трактуется ФАС как недостоверная реклама.
  mitigation:
    - "Удалите слова превосходной степени или добавьте объективный критерий сравнения"
    - "Сошлитесь на подтверждающий источник (исследование, рейтинг с методологией)"
    - "Уточните: «по версии …», «по данным … за … год»"

guarantee:
  title: "Гарантии результата / безусловные обещания"
  type: "phrase_any"
  # Без бытового «гарантированно»: финансовые гарантии обрабатываются категориями
  # (инвестиции — запрет ст. 28 ч. 2 п. 1; вклад — фиксированная ставка допустима).
  terms: ["гарантия результата", "гарантируем результат", "100% результат", "стопроцентно",
          "абсолютно безопасно", "без побочных", "без противопоказаний", "навсегда избавит",
          "мгновенный результат", "вылечит", "излечивает", "пожизненная гарантия"]
  risk_level: "high"
  law_refs: ["fz38_st5_p3"]
  liability_refs: ["koap_14_3_1"]
  practice_refs: []
  description: >-
    Безусловные обещания результата и гарантии эффективности могут быть признаны
    недостоверной рекламой, особенно для медицинских и финансовых продуктов.
  mitigation:
    - "Замените безусловные обещания на корректные формулировки"
    - "Избегайте гарантий эффективности лечения и гарантий дохода"

comparison:
  title: "Некорректное сравнение с конкурентом"
  type: "morph_comparative"
  # Основной способ — морфология: ловит ЛЮБУЮ сравнительную степень («активнее»,
  # «сильнее», «выгоднее», «лучше», «дешевле»…), в т. ч. сравнение с названным
  # конкурентом («Сбер активнее Альфабанка»). Слишком общие формы («больше»,
  # «выше», «более») исключены — см. morphology._COMPARATIVE_STOP.
  # patterns_regex — запасной путь: глаголы превосходства и исключительность
  # (это НЕ сравнительная степень). В автономной JS-версии морфологии нет —
  # там сравнительная степень определяется эвристикой по окончанию «-ее».
  patterns_regex:
    - '(?:^|[^а-яёА-ЯЁa-zA-Z])(превосход[а-яё]*|обгоня[а-яё]+|опережа[а-яё]+|обходит|обходим)(?![а-яёА-ЯЁa-zA-Z])'
    - 'в отличие от других|никто (?:другой )?не предлагает|только у нас|не имеет аналог[а-яё]*|аналог[а-яё]* нет'
  risk_level: "medium"
  law_refs: ["fz38_st5_p2", "fz38_st5_p3_1"]
  liability_refs: ["koap_14_3_1"]
  practice_refs: ["comparison"]
  description: >-
    Обнаружено сравнительное утверждение превосходства («лучше», «сильнее»,
    «выгоднее» и т. п.). Сравнение — в том числе с прямо названным конкурентом
    («X лучше Y») — без объективного, измеримого и подтверждённого критерия
    признаётся некорректным сравнением и недобросовестной/недостоверной рекламой.
    Прямое сравнение с названным брендом дополнительно рискует порочить его
    деловую репутацию (ст. 5 ч. 2 п. 2). Требуется проверка контекста: не всякая
    сравнительная форма — сравнение с конкурентом; оцените, есть ли реальное
    сопоставление и подтверждён ли критерий.
  mitigation:
    - "Уберите сравнение с конкурентом либо приведите объективный измеримый критерий и его подтверждение"
    - "Не называйте конкурента и не утверждайте превосходство над ним без доказательств"
    - "Замените оценку фактом: «ставка X %», «срок Y дней» вместо «лучше/выгоднее»"

prohibited_content:
  title: "Запрещённое содержание рекламы (ст. 5 ч. 4)"
  type: "phrase_any"
  # Узкий список однозначных в рекламном контексте маркеров. Остальные запреты
  # ч. 4 (побуждение к противоправным действиям, сходство с дорожными знаками,
  # негативное отношение к непользующимся) — смысловые, их ловит LLM-анализ и скилл.
  terms: ["порнограф", "педофил", "смена пола", "сменить пол", "отказ от деторождения",
          "чайлдфри", "childfree", "нетрадиционные сексуальные", "нетрадиционных сексуальных",
          "призыв к насилию", "призываем к насилию", "призывы к насилию", "пропаганда насилия"]
  risk_level: "high"
  law_refs: ["fz38_st5_p4"]
  liability_refs: ["koap_14_3_1"]
  practice_refs: []
  description: >-
    Обнаружены маркеры содержания, запрещённого ч. 4 ст. 5 (порнография; насилие
    и жестокость; пропаганда нетрадиционных сексуальных отношений/предпочтений,
    педофилии, смены пола, отказа от деторождения). Требуется ручная проверка
    контекста: если содержание действительно присутствует — такая реклама не
    допускается. Движок не оценивает контекст (например, социальную рекламу против
    насилия) — решение принимает юрист.
  mitigation:
    - "Удалите запрещённое содержание — реклама с ним не допускается (ст. 5 ч. 4)"
    - "Убедитесь, что нет побуждения к противоправным действиям, призывов к насилию и запрещённой пропаганды"
    - "Проверьте контекст срабатывания: возможно ложное совпадение (например, социальная реклама)"

obscene_or_offensive_language:
  title: "Бранное, непристойное или оскорбительное выражение"
  type: "ethics_lexicon"
  risk_level: "critical"
  law_refs: ["fz38_st5_p6"]
  liability_refs: ["koap_14_3_1"]
  practice_refs: ["obscene_or_offensive_language"]
  description: >-
    Обнаружена лексика, которая может быть отнесена к бранным словам либо к
    непристойным или оскорбительным выражениям. Часть 6 статьи 5 ФЗ «О рекламе»
    прямо запрещает такие элементы в рекламе. Строгий фильтр также распознаёт
    часть намеренно искажённых написаний с заменой букв, цифрами, звёздочками,
    дефисами или разрядкой. До удаления выражения материал нельзя согласовать.
  mitigation:
    - "Удалите бранное, непристойное или оскорбительное выражение из всех материалов кампании"
    - "Замените его нейтральной формулировкой, описывающей свойство товара без унижения людей или конкурентов"
    - "Повторно проверьте текст, изображение, аудиодорожку, титры и сценарий после исправления"

free_bait:
  title: "«Бесплатно» / «акция» при наличии условий"
  type: "phrase_any"
  terms: ["бесплатно", "0 рублей", "0 ₽", "даром", "в подарок", "бесплатный"]
  risk_level: "low"
  law_refs: ["fz38_st5_p7"]
  liability_refs: ["koap_14_3_1"]
  practice_refs: []
  description: >-
    Слова «бесплатно»/«акция» требуют раскрытия существенных условий. Их отсутствие
    может ввести потребителя в заблуждение (ст. 5 ч. 7).
  mitigation:
    - "Раскройте все существенные условия акции (сроки, ограничения, что входит)"
    - "Избегайте «бесплатно», если получение блага обусловлено покупкой"

personal_data:
  title: "Сбор персональных данных"
  type: "phrase_any"
  terms: ["оставьте телефон", "оставьте заявку", "введите номер", "укажите e-mail",
          "укажите email", "оставьте контакты", "заполните форму", "оставьте свой номер",
          "получите на почту", "подпишитесь", "оставить заявку"]
  risk_level: "medium"
  law_refs: ["fz152_pdn"]
  liability_refs: ["koap_13_11_pdn"]
  practice_refs: []
  description: >-
    Реклама предполагает сбор персональных данных. Необходимо согласие субъекта на
    обработку ПДн и наличие политики обработки персональных данных.
  mitigation:
    - "Добавьте чекбокс согласия на обработку ПДн со ссылкой на политику"
    - "Разместите политику обработки персональных данных"

erid_missing:
  title: "Отсутствует идентификатор рекламы (erid)"
  type: "absent_all"
  patterns_regex: ["erid", "ерид", "kt[a-z0-9]{6,}"]
  risk_level: "high"
  law_refs: ["fz38_st18_1"]
  liability_refs: ["koap_14_3_16"]
  practice_refs: ["erid_missing"]
  description: >-
    Для интернет-рекламы обязателен уникальный идентификатор erid, присвоенный ОРД.
    В проверяемом контенте он не обнаружен.
  mitigation:
    - "Получите erid у оператора рекламных данных (ОРД) до запуска"
    - "Разместите erid в креативе/тексте и обеспечьте передачу сведений в ЕРИР"

reklama_label_missing:
  title: "Отсутствует пометка «реклама» и рекламодатель"
  type: "absent_all"
  patterns_regex: ["реклама", "рекламодатель"]
  risk_level: "medium"
  law_refs: ["fz38_st18_1"]
  liability_refs: ["koap_14_3_16"]
  practice_refs: ["erid_missing"]
  description: >-
    Интернет-реклама должна содержать пометку «реклама» и указание на рекламодателя
    (или ссылку на сайт с информацией о нём).
  mitigation:
    - "Добавьте пометку «Реклама» и данные рекламодателя (ИНН/наименование)"

age_marking_missing:
  title: "Отсутствует возрастная маркировка информационной продукции"
  # Знак (0+…18+) обязателен в рекламе ТОЛЬКО если объект рекламы — информационная
  # продукция, ПОДЛЕЖАЩАЯ классификации по ФЗ № 436-ФЗ (фильмы, книги, СМИ, игры,
  # зрелищные мероприятия, распространяемые приложения-продукты). ст. 5 ФЗ «О рекламе»
  # распространяет это на рекламу. Не для обычных товаров/услуг и изъятий ч. 2 ст. 1
  # ФЗ № 436-ФЗ. Упоминание «приложение» как канала («заходи в приложение») — НЕ триггер.
  type: "conditional"
  # Стоящие сами по себе виды классифицируемой информационной продукции.
  trigger_patterns: ["фильм", "кино", "сериал", "мультфильм", "спектакл", "театр",
                     "концерт", "выставк", "фестивал", "книг", "журнал", "газет",
                     "печатное издание", "сетевое издание", "телеканал", "телепередач",
                     "радиостанц", "подкаст", "видеоигр", "компьютерная игра",
                     "мобильная игра", "настольная игра"]
  # Знак с границей слева, чтобы «0+» не совпадало внутри «100+».
  required_groups:
    - ['re:(^|[^0-9])(0|6|12|16|18)\+']
  risk_level: "low"
  law_refs: ["fz436_age"]
  liability_refs: ["koap_14_3_1"]
  practice_refs: ["age_marking"]
  description: >-
    Рекламируется информационная продукция, подлежащая классификации по ФЗ № 436-ФЗ
    (фильм, книга, СМИ, игра, зрелищное мероприятие, распространяемое приложение/ПО),
    но не обнаружен знак возрастной категории (0+…18+). Ст. 5 ФЗ «О рекламе»
    распространяет требование о знаке на рекламу; его отсутствие ФАС признаёт
    ненадлежащей рекламой (ст. 14.3 КоАП). Требование НЕ распространяется на обычные
    товары/услуги и на изъятия ч. 2 ст. 1 ФЗ № 436-ФЗ (продукция значительной
    культурной/исторической/художественной ценности и др.).
  mitigation:
    - "Добавьте знак возрастной категории (0+…18+) согласно классификации продукции"
    - "Если продукция под изъятие ч. 2 ст. 1 ФЗ № 436-ФЗ — знак не требуется"

age_marking_app:
  title: "Отсутствует возрастная маркировка мобильного приложения"
  # Реклама мобильного приложения (программы для ЭВМ) ВСЕГДА должна содержать знак
  # возрастной категории (0+…18+). Отличаем рекламу приложения от «приложения как
  # канала»: «в приложении / через приложение» (оплати/оформи/зайди) — это канал,
  # знак не требуется, если нет признаков рекламы самого приложения.
  type: "conditional"
  trigger_patterns: ["приложени", "мобильное приложение", "программа для эвм"]
  exclude_patterns: ["в приложении", "в приложение", "через приложение", "в приложениях"]
  exclude_unless_patterns: ["скачай", "скачать", "скачайте", "установи", "установить",
     "загрузи", "app store", "appstore", "google play", "play маркет", "play market",
     "rustore", "app gallery", "appgallery", "новое приложение", "наше приложение",
     "мобильное приложение", "приложение для", "приложение —", "приложение,",
     "приложение.", "приложение «", "магазин приложений", "доступно в"]
  required_groups:
    - ['re:(^|[^0-9])(0|6|12|16|18)\+']
  risk_level: "low"
  law_refs: ["fz436_age"]
  liability_refs: ["koap_14_3_1"]
  practice_refs: ["age_marking"]
  description: >-
    Рекламируется мобильное приложение (программа для ЭВМ — информационная продукция по
    ФЗ № 436-ФЗ), но не обнаружен знак возрастной категории (0+…18+). В рекламе
    приложения знак обязателен всегда; ст. 5 ФЗ «О рекламе» — реклама без знака
    ненадлежащая (ст. 14.3 КоАП). Упоминание приложения как канала («оплати в
    приложении») знака не требует.
  mitigation:
    - "Добавьте знак возрастной категории (0+…18+) в рекламу приложения"

distance_selling:
  title: "Дистанционная продажа без реквизитов продавца"
  type: "conditional"
  # Применяем к ЛЮБОЙ продаже товара (приглашение купить/заказать/доставка), а не только
  # при слове «онлайн». Дистанционность подразумевается; для чисто офлайн-покупки риск
  # снимает юрист. Финансовые услуги (вклад/кредит: «оформи вклад») сюда НЕ попадают —
  # используем слова покупки товара, без общего «оформи».
  trigger_patterns: ["купи", "купить", "купите", "куплю", "покупай", "покупайте",
                     "закажи", "закажите", "заказать", "заказ", "приобрест", "приобрет",
                     "в корзину", "добавить в корзину", "в продаже", "поступил в продаж",
                     "с доставкой", "доставка", "доставим", "привезём", "привезем",
                     "пришлём", "пришлем", "интернет-магазин", "интернет магазин",
                     "маркетплейс", "закажи онлайн", "купи онлайн"]
  # Явный офлайн снимает риск (кроме случаев, когда есть признак дистанционности ниже).
  # Маркеры — по основам слов, чтобы «в нашем магазине» тоже ловилось.
  exclude_patterns: ["магазин", "салон", "пекарн", "кофейн", "аптек", "бутик", "киоск",
                     "ателье", "шоурум", "пункт выдачи", "офлайн", "оффлайн", "приходите",
                     "приходи к нам", "ждём вас", "ждем вас", "в торговом центре", "в тц ",
                     "посетите наш", "только в наших", "в нашей точке"]
  # …но если есть явный признак дистанционной продажи — исключение не действует.
  exclude_unless_patterns: ["на сайте", "онлайн", "в интернете", "интернет-магазин",
                            "маркетплейс", "доставка", "с доставкой", "доставим", "по почте"]
  required_patterns: ["огрн", "инн", "ип "]
  risk_level: "medium"
  law_refs: ["fz38_st8"]
  liability_refs: ["koap_14_3_1"]
  practice_refs: []
  description: >-
    Реклама товаров при дистанционном способе продажи должна содержать сведения о
    продавце (наименование и ОГРН для юрлица; ФИО и ОГРНИП для ИП; ФИО и ИНН для
    самозанятого). В рекламе они не обнаружены.
  mitigation:
    - "Добавьте наименование и ОГРН (для юрлица) либо ФИО и ОГРНИП/ИНН продавца"

promo_event:
  title: "Стимулирующее мероприятие без обязательных сведений"
  type: "conditional"
  trigger_patterns: ["розыгрыш", "разыгр", "конкурс", "выигра", "главный приз",
                     "ценные призы", "гарантированный приз", "участвуй", "лотере"]
  # Норма требует ОБА элемента одновременно (ст. 9): (1) сроки И (2) источник правил.
  # required_groups — нужно совпадение в КАЖДОЙ группе (элемент 're:' — регэксп даты).
  required_groups:
    # (1) сроки проведения мероприятия (слово или дата/период)
    - ["срок", "период", "продлится", "проводится с", "действует до",
       're:\d{1,2}[.\-/]\d{1,2}',
       're:\d{1,2}\s*[–—\-]?\s*\d{0,2}\s*(январ|феврал|март|апрел|мая|июн|июл|август|сентябр|октябр|ноябр|декабр)']
    # (2) источник информации об организаторе / правилах / призах / порядке получения
