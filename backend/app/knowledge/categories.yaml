# Категории товаров/услуг с особым правовым режимом рекламы.
# keywords — леммы/подстроки для эвристического определения категории.
# required_disclaimers — обязательные предупреждения (проверяется их наличие).
# prohibitions — типовые запреты (для контекста LLM и подсказок пользователю).

alcohol:
  title: "Алкогольная продукция"
  keywords: ["алкоголь", "водка", "вино", "винный", "пиво", "пивной", "коньяк", "виски",
             "ром", "текила", "джин", "ликёр", "ликер", "шампанское", "игристое",
             "вермут", "бренди", "сидр", "алкогольный", "крепкий напиток", "бар", "винотека"]
  law_refs: ["fz38_st21"]
  liability_refs: ["koap_14_3_2_5"]
  practice_refs: ["alcohol"]
  required_disclaimers:
    - id: "alcohol_harm_warning"
      text: "Предупреждение о вреде чрезмерного потребления алкоголя (≥10% площади)"
      patterns: ["чрезмерное употребление", "вред", "вредит вашему здоровью"]
  prohibitions:
    - "Реклама алкоголя в сети «Интернет» полностью запрещена"
    - "Запрещено обращение к несовершеннолетним и использование их образов"
    - "Запрещено утверждать о пользе алкоголя для здоровья"
  risk_level: "critical"

tobacco:
  title: "Табак, вейпы, никотинсодержащая продукция"
  keywords: ["сигарета", "сигареты", "табак", "табачный", "вейп", "вейпинг", "электронная сигарета",
             "электронные сигареты", "кальян", "никотин", "никотиновый", "жидкость для вейпа",
             "iqos", "айкос", "снюс", "нюхательный табак", "испаритель", "под-система", "pod-система"]
  law_refs: ["fz38_tobacco", "fz38_st7"]
  liability_refs: ["koap_14_3_1_tobacco"]
  practice_refs: ["tobacco"]
  required_disclaimers: []
  prohibitions:
    - "Реклама табака, вейпов и никотинсодержащей продукции полностью запрещена"
  risk_level: "critical"

medicine:
  title: "Лекарства, медицинские изделия и услуги"
  keywords: ["лекарство", "лекарственный", "препарат", "таблетки", "капсулы", "мазь", "сироп",
             "вакцина", "медицинский", "клиника", "врач", "лечение", "лечит", "вылечит",
             "терапия", "диагностика", "операция", "медизделие", "рецепт", "аптека",
             "болезнь", "симптом", "недуг", "исцеление"]
  law_refs: ["fz38_st24"]
  liability_refs: ["koap_14_3_2_5"]
  practice_refs: ["medicine"]
  required_disclaimers:
    - id: "medicine_warning"
      text: "Предупреждение о противопоказаниях и необходимости консультации специалиста"
      patterns: ["противопоказан", "проконсультируйтесь", "консультация специалиста",
                 "ознакомьтесь с инструкцией", "необходима консультация"]
  prohibitions:
    - "Запрещены гарантии эффективности и ссылки на конкретные случаи излечения"
    - "Реклама рецептурных препаратов вне спец. изданий запрещена"
  risk_level: "high"

bad:
  title: "Биологически активные добавки (БАД)"
  keywords: ["бад", "биологически активная добавка", "добавка к пище", "витаминный комплекс",
             "нутрицевтик", "фитокомплекс", "пищевая добавка"]
  law_refs: ["fz38_st25"]
  liability_refs: ["koap_14_3_2_5"]
  practice_refs: ["bad"]
  required_disclaimers:
    - id: "bad_warning"
      text: "Предупреждение «не является лекарственным средством» (≥10% площади)"
      patterns: ["не является лекарственным средством", "не лекарство"]
  prohibitions:
    - "Запрещено создавать впечатление лекарственного средства и лечебных свойств"
  risk_level: "high"

# --- Финансы разделены по режимам регулирования (ст. 28 ФЗ-38) ---
credit:
  title: "Кредиты, займы, ипотека"
  keywords: ["кредит", "кредитный", "займ", "заём", "микрозайм", "микрозаём", "рассрочка",
             "ипотека", "ипотечный", "кредитная карта", "мфо", "автокредит",
             "потребительский кредит", "рефинансирование", "кредит наличными"]
  law_refs: ["fz38_st28_credit", "fz38_st28_1"]
  liability_refs: ["koap_14_3_fin"]
  practice_refs: ["credit"]
  risk_level: "high"
  required_disclaimers:
    - id: "credit_warning"
      label: "«Оценивайте свои финансовые возможности и риски» (ст. 28 ч. 3.1)"
      text: >-
        Предупреждение «Оценивайте свои финансовые возможности и риски» — обязательно в
        любой рекламе потребкредита/займа и ипотеки физлицам (ч. 3.2): радио ≥3 сек;
        ТВ/видео ≥3 сек и ≥5% площади кадра; иные способы ≥5% рекламной площади
      patterns: ["оценивайте свои финансовые возможности"]
      law_refs: ["fz38_st28_3_1_warning", "fz38_st28_3_2_mortgage"]
    - id: "firm_name"
      label: "Фирменное наименование кредитора (ст. 28 ч. 1)"
      text: >-
        Фирменное наименование лица, оказывающего услуги: организационно-правовая форма +
        название (для ИП — фамилия, имя, отчество). Бренд, логотип, товарный знак и
        коммерческое обозначение фирменным наименованием не являются
      patterns: ["пао ", " пао", "(пао", "оао ", "(оао", "зао ", "(зао", "ооо ", "(ооо",
                 " ао ", "(ао)", "ао «", "нко ", "публичное акционерное", "акционерное общество",
                 "общество с ограниченной ответственностью", "индивидуальный предприниматель", "ип "]
      law_refs: ["fz38_st28_1"]
  conditional_disclaimers:
    - id: "credit_psk"
      label: "Диапазоны полной стоимости кредита при указании ставки (ст. 28 ч. 3)"
      text: >-
        При указании процентных ставок реклама должна содержать диапазоны полной
        стоимости кредита (займа) по видам кредита ИМЕННО СО СЛОВАМИ «полная стоимость
        кредита (займа)» (аббревиатуры «ПСК» недостаточно), ДО информации о ставках и
        шрифтом не меньше шрифта ставок. Для ипотеки физлицам — те же правила (ч. 3.2)
      trigger_patterns: ["%", "процент", "годовых", "ставк"]
      required_patterns: ["полная стоимость кредита", "полная стоимость займа", "полной стоимости кредита", "полной стоимости займа"]
      law_refs: ["fz38_st28_3_psk", "fz38_st28_3_2_mortgage"]
    - id: "credit_terms"
      label: "«Изучите все условия кредита (займа)» (ст. 28 ч. 2.1)"
      text: >-
        При указании условия, влияющего на полную стоимость кредита, реклама должна
        содержать предупреждение «Изучите все условия кредита (займа)» с указанием
        раздела сайта кредитора либо все такие условия непосредственно в рекламе
        (радио ≥3 сек; ТВ/видео ≥3 сек и ≥5% кадра; иное ≥5% площади)
      trigger_patterns: ["%", "процент", "годовых", "ставк", "переплата",
                          "ежемесячный платеж", "ежемесячный платёж", "срок кредита", "первоначальный взнос"]
      required_patterns: ["изучите все условия"]
      law_refs: ["fz38_st28_2_1_terms", "fz38_st28_3_2_mortgage"]
    - id: "credit_link"
      label: "Ссылка на раздел сайта с условиями кредита (ст. 28 ч. 2.1 п. 1)"
      text: >-
        К предупреждению «Изучите все условия кредита (займа)» должно прилагаться
        указание на раздел официального сайта кредитора, где размещены условия,
        влияющие на полную стоимость кредита
      trigger_patterns: ["изучите все условия"]
      required_patterns: ["http", "www.", ".ru", ".рф", ".com", "на сайте",
                          "на нашем сайте", "на официальном сайте", "в разделе"]
      law_refs: ["fz38_st28_2_1_terms"]
  # Конкретные требования вынесены в отдельные проверки (предупреждения/условия),
  # чтобы не дублировать их в общей карточке категории.
  prohibitions: []

deposit:
  title: "Вклады и депозиты"
  keywords: ["вклад", "вклады", "депозит", "депозитный", "накопительный счет",
             "накопительный счёт", "сберегательный счет", "сберегательный счёт", "сберегательный вклад"]
  # Ловим «вклад»/«депозит» внутри слитных маркетинговых форм: «Супервклад»,
  # «Мегадепозит», «Промовклад», «Мультивклад» и т. п. Исключаем ложные формы,
  # содержащие «вклад» не в смысле банковского вклада.
  keyword_substrings: ["вклад", "депозит"]
  keyword_substrings_exclude: ["вкладк", "вкладыш"]
  law_refs: ["fz38_st28_2_2", "fz38_st28_1"]
  liability_refs: ["koap_14_3_fin"]
  practice_refs: ["deposit"]
  risk_level: "medium"
  required_disclaimers:
    - id: "firm_name"
      label: "Фирменное наименование (имя) лица (ст. 28 ч. 1)"
      text: >-
        Фирменное наименование лица: организационно-правовая форма + название
        (для ИП — фамилия, имя, отчество). Бренд, логотип, товарный знак и
        коммерческое обозначение фирменным наименованием не являются
      patterns: ["пао ", " пао", "(пао", "оао ", "(оао", "зао ", "(зао", "ооо ", "(ооо",
                 " ао ", "(ао)", "ао «", "нко ", "публичное акционерное", "акционерное общество",
                 "общество с ограниченной ответственностью", "индивидуальный предприниматель", "ип "]
      law_refs: ["fz38_st28_1"]
  conditional_disclaimers:
    - id: "deposit_terms"
      label: "Все условия, влияющие на доход по вкладу (ст. 28 ч. 2 п. 2)"
      text: >-
        Если в рекламе указано хотя бы одно финансовое условие (ставка, «до X%», срок,
        сумма, порядок/сумма выплаты, надбавка), нужно раскрыть все иные условия,
        влияющие на доход/расход: срок, минимальная/максимальная сумма, порядок
        начисления и выплаты процентов, капитализация, пополнение/снятие, досрочное
        расторжение. Письмо ФАС от 17.10.2023 № КТ/85530/23
      # Дефолт: при любом финусловии риск выводится ВСЕГДА (полноту раскрытия оценивает
      # юрист). Триггер — реально указанный финансовый параметр, а не общие слова
      # «доход/вклад/выгодный».
      always_when_triggered: true
      trigger_patterns: ["%", "процент", "годовых", "ставк", "₽", "руб", "тыс", "млн",
                         "сумм", "месяц", "срок", " год", " лет"]
      required_patterns: ["срок", "капитализац", "минимальная сумма", "минимальную сумму",
                          "пополнени", "снятие", "все условия", "полные условия"]
      law_refs: ["fz38_st28_2_2"]

