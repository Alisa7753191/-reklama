# Примеры правоприменительной практики ФАС и судов по типовым нарушениям.
# Носят иллюстративный характер; для юридически значимых выводов сверяйтесь
# с первоисточниками и актуальной практикой.

superlative:
  - type: "ФАС"
    reference: "Практика ФАС по ст. 5 ч. 3 ФЗ-38"
    summary: >-
      Использование в рекламе слов «№1», «лучший», «самый» без указания критерия
      сравнения и документального подтверждения систематически признаётся ФАС
      недостоверной рекламой. Требуется ссылка на объективный источник (напр.,
      исследование, рейтинг с методологией).
    url: "https://fas.gov.ru/"

comparison:
  - type: "ФАС"
    reference: "Практика ФАС по некорректному сравнению (ст. 5 ч. 2)"
    summary: >-
      Сравнение «лучше, чем у конкурентов» без конкретных измеримых параметров и
      подтверждения признаётся некорректным сравнением и недобросовестной рекламой.
    url: "https://fas.gov.ru/"

erid_missing:
  - type: "ФАС/РКН"
    reference: "Практика по ст. 18.1 ФЗ-38 и ст. 14.3 ч.15–16 КоАП"
    summary: >-
      С 2023 года ФАС и Роскомнадзор активно штрафуют за интернет-рекламу без
      маркировки (erid, пометка «реклама», указание рекламодателя) и за
      непередачу сведений в ЕРИР. Штрафы налагаются на каждое рекламное сообщение.
    url: "https://rkn.gov.ru/"

medicine:
  - type: "ФАС"
    reference: "Практика ФАС по ст. 24 ФЗ-38"
    summary: >-
      Отсутствие предупреждения о противопоказаниях и необходимости консультации
      специалиста, а также утверждения о гарантированном излечении — частые
      основания для штрафов за рекламу лекарств и медуслуг.
    url: "https://fas.gov.ru/"

bad:
  - type: "ФАС"
    reference: "Практика ФАС по ст. 25 ФЗ-38"
    summary: >-
      Реклама БАД, создающая впечатление лекарственного средства («лечит»,
      «избавляет от болезни») без предупреждения «не является лекарственным
      средством», признаётся нарушением.
    url: "https://fas.gov.ru/"

finance:
  - type: "ФАС"
    reference: "Практика ФАС по ст. 28 ФЗ-38"
    summary: >-
      Реклама кредита с указанием одной привлекательной ставки без раскрытия полной
      стоимости кредита и прочих условий признаётся нарушением. Мелкий шрифт для
      существенных условий также оценивается как введение в заблуждение.
    url: "https://fas.gov.ru/"

alcohol:
  - type: "ФАС"
    reference: "Практика ФАС по ст. 21 ФЗ-38"
    summary: >-
      Любая реклама алкоголя в сети «Интернет» запрещена; штрафуется размещение
      постов, баннеров и упоминаний со ссылкой на приобретение.
    url: "https://fas.gov.ru/"

tobacco:
  - type: "ФАС"
    reference: "Практика ФАС/ст. 14.3.1 КоАП"
    summary: >-
      Реклама вейпов, электронных сигарет, жидкостей и устройств для потребления
      никотина запрещена; штрафуется в т.ч. продвижение в соцсетях и у блогеров.
    url: "https://fas.gov.ru/"
