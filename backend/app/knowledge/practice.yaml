# Примеры правоприменительной практики ФАС и судов по типовым нарушениям.
# Носят иллюстративный характер; для юридически значимых выводов сверяйтесь
# с первоисточниками и актуальной практикой.

superlative:
  - type: "ФАС"
    reference: "Практика ФАС по ст. 5 ч. 3 ФЗ-38"
    summary: >-
      Использование в рекламе слов «№1», «лучший», «самый» без указания критерия
      сравнения и документального подтверждения систематически признаётся ФАС
      недостоверной рекламой. Требуется ссылка на объективный источник (напр.,
      исследование, рейтинг с методологией).
    url: "https://fas.gov.ru/"

comparison:
  - type: "ФАС"
    reference: "Практика ФАС по некорректному сравнению (ст. 5 ч. 2)"
    summary: >-
      Сравнение «лучше, чем у конкурентов» без конкретных измеримых параметров и
      подтверждения признаётся некорректным сравнением и недобросовестной рекламой.
    url: "https://fas.gov.ru/"

obscene_or_offensive_language:
  - type: "Разъяснение ФАС России"
    reference: "Письмо ФАС России от 29.04.2013 № АД/17355/13"
    summary: >-
      ФАС относит к бранным не только нецензурные слова, но и выражения,
      используемые как ругательства или оскорбления. Непристойными могут быть
      признаны слова и изображения, нарушающие общепринятые нормы морали и
      нравственности; оценка конкретного контекста может требовать заключения
      экспертного совета.
    url: "https://www.consultant.ru/document/cons_doc_LAW_146914/"

erid_missing:
  - type: "ФАС/РКН"
    reference: "Практика по ст. 18.1 ФЗ-38 и ст. 14.3 ч.15–16 КоАП"
    summary: >-
      С 2023 года ФАС и Роскомнадзор активно штрафуют за интернет-рекламу без
      маркировки (erid, пометка «реклама», указание рекламодателя) и за
      непередачу сведений в ЕРИР. Штрафы налагаются на каждое рекламное сообщение.
    url: "https://rkn.gov.ru/"

medicine:
  - type: "ФАС"
    reference: "Практика ФАС по ст. 24 ФЗ-38"
    summary: >-
      Отсутствие предупреждения о противопоказаниях и необходимости консультации
      специалиста, а также утверждения о гарантированном излечении — частые
      основания для штрафов за рекламу лекарств и медуслуг.
    url: "https://fas.gov.ru/"

bad:
  - type: "ФАС"
    reference: "Практика ФАС по ст. 25 ФЗ-38"
    summary: >-
      Реклама БАД, создающая впечатление лекарственного средства («лечит»,
      «избавляет от болезни») без предупреждения «не является лекарственным
      средством», признаётся нарушением.
    url: "https://fas.gov.ru/"

credit:
  - type: "ФАС"
    reference: "Практика ФАС по ст. 28 ФЗ-38 (кредиты)"
    summary: >-
      Реклама кредита с указанием одной привлекательной ставки без раскрытия полной
      стоимости кредита (ПСК) и прочих условий признаётся нарушением. С 01.03.2025
      обязательны предупреждение «Оценивайте свои финансовые возможности и риски» и
      призыв изучить все условия; мелкий шрифт существенных условий — введение в
      заблуждение.
    url: "https://fas.gov.ru/"

deposit:
  - type: "ФАС"
    reference: "Практика ФАС по ст. 28 ч. 2 п. 2 (вклады)"
    summary: >-
      Дело о рекламе вклада «Супер-вклад 12%»: указана ставка, но не раскрыты все
      условия, влияющие на доходность (срок, сумма, капитализация). ФАС признала
      нарушением умолчание об условиях при указании хотя бы одного из них.
    url: "https://www.consultant.ru/legalnews/26713/"

investment:
  - type: "ФАС"
    reference: "Практика ФАС по ст. 28 ч. 2 п. 1 (инвестиции)"
    summary: >-
      Обещание гарантированной доходности инвестиций/вложений, если она не может быть
      определена на момент договора, признаётся нарушением. Прогнозы дохода на основе
      прошлых показателей также рискованны.
    url: "https://fas.gov.ru/"

bankruptcy:
  - type: "ФАС"
    reference: "Ст. 28 ФЗ-38 (332-ФЗ), с 01.01.2026"
    summary: >-
      Реклама услуг по банкротству граждан без предупреждения о негативных последствиях
      и с обещанием «гарантированного списания долгов» / «законно не платить» — нарушение;
      ответственность несёт в т.ч. рекламораспространитель.
    url: "https://www.consultant.ru/legalnews/29175/"

alcohol:
  - type: "ФАС"
    reference: "Практика ФАС по ст. 21 ФЗ-38"
    summary: >-
      Любая реклама алкоголя в сети «Интернет» запрещена; штрафуется размещение
      постов, баннеров и упоминаний со ссылкой на приобретение.
    url: "https://fas.gov.ru/"

tobacco:
  - type: "ФАС"
    reference: "Практика ФАС/ст. 14.3.1 КоАП"
    summary: >-
      Реклама вейпов, электронных сигарет, жидкостей и устройств для потребления
      никотина запрещена; штрафуется в т.ч. продвижение в соцсетях и у блогеров.
    url: "https://fas.gov.ru/"

age_marking:
  - type: "ФАС"
    reference: "Практика ФАС по ст. 11 ФЗ-38 и 436-ФЗ"
    summary: >-
      Возрастной знак (0+…18+) в рекламе обязателен, только если объект рекламы —
      информационная продукция, подлежащая маркировке по 436-ФЗ (сетевые издания/СМИ,
      фильмы, книги, игры, зрелищные мероприятия). Реклама обычных товаров и услуг
      возрастной маркировки не требует.
    url: "https://www.consultant.ru/law/podborki/vozrastnye_ogranicheniya_v_reklame/"
